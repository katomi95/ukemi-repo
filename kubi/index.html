<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#9fd8f5">
<title>首を長くして待つ</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{width:100%;height:100%;overflow:hidden;background:#9fd8f5;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    font-family:"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","YuGothic",Meiryo,system-ui,sans-serif;
    color:#2b3440;}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;}
  .hide{display:none!important;}

  #hud{position:fixed;left:max(14px,env(safe-area-inset-left));top:max(10px,env(safe-area-inset-top));pointer-events:none;
       font-weight:700;letter-spacing:.04em;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 6px #fff;}
  #hud .l1{font-size:clamp(15px,2.6vmin,22px);}
  #hud .l1 b{font-size:1.45em;margin:0 .1em;font-variant-numeric:tabular-nums;}
  #hud .l2{font-size:clamp(11px,1.8vmin,15px);opacity:.75;margin-top:.15em;}

  .ui-btn{position:fixed;pointer-events:auto;cursor:pointer;font-family:inherit;font-weight:700;color:#2b3440;
          border:2px solid #2b3440;background:rgba(255,255,255,.85);border-radius:2em;}
  #mute{top:max(10px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));font-size:14px;padding:.35em .9em;}
  #back{left:max(14px,env(safe-area-inset-left));bottom:max(14px,env(safe-area-inset-bottom));font-size:16px;padding:.7em 1.2em;
        box-shadow:0 3px 0 #2b3440;}
  #back:active,#back.on{transform:translateY(2px);box-shadow:0 1px 0 #2b3440;background:#ffe9a8;}

  #hint{position:fixed;left:0;right:0;bottom:max(18px,env(safe-area-inset-bottom));text-align:center;pointer-events:none;
        font-size:clamp(13px,2.2vmin,18px);font-weight:700;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 8px #fff;
        transition:opacity .6s;}

  .screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;text-align:center;pointer-events:none;}
  #title{justify-content:flex-start;padding-top:max(7vh,env(safe-area-inset-top));}
  #title h1{font-size:clamp(34px,8.5vmin,84px);font-weight:800;letter-spacing:.08em;color:#2b3440;
            text-shadow:0 4px 0 #fff,0 0 18px rgba(255,255,255,.9);line-height:1.15;}
  #title h1 .nb{display:inline-block;transform:scaleX(1.55);margin:0 .32em;}
  #title .en{font-size:clamp(10px,1.7vmin,14px);letter-spacing:.35em;opacity:.6;margin:.4em 0 1.4em;font-weight:700;}
  .big-btn{pointer-events:auto;cursor:pointer;font-family:inherit;font-weight:800;font-size:clamp(17px,3.2vmin,26px);
           letter-spacing:.15em;padding:.6em 1.9em;border:3px solid #2b3440;border-radius:.6em;background:#fff8e6;color:#2b3440;
           box-shadow:0 5px 0 #2b3440;}
  .big-btn:active{transform:translateY(3px);box-shadow:0 2px 0 #2b3440;}
  #title .note{margin-top:1.2em;font-size:clamp(11px,1.8vmin,14px);line-height:1.8;opacity:.75;font-weight:700;
               text-shadow:0 0 3px #fff,0 0 3px #fff;}

  #result{justify-content:flex-start;padding-top:max(6vh,env(safe-area-inset-top));}
  #result .card{background:rgba(255,253,245,.92);border:3px solid #2b3440;border-radius:16px;padding:1.1em 2.2em 1.3em;
                box-shadow:0 6px 0 rgba(43,52,64,.85);animation:pop .5s cubic-bezier(.2,1.6,.4,1);}
  #result .r1{font-size:clamp(28px,6.5vmin,60px);font-weight:800;letter-spacing:.06em;}
  #result .r2{font-size:clamp(16px,3.2vmin,28px);font-weight:800;margin-top:.45em;color:#c0392b;}
  #result .r3{font-size:clamp(13px,2.4vmin,20px);font-weight:700;margin-top:.3em;}
  #result .r4{font-size:clamp(11px,1.8vmin,15px);opacity:.65;margin-top:.35em;font-weight:700;}
  #result .big-btn{margin-top:1em;font-size:clamp(14px,2.6vmin,20px);opacity:0;transition:opacity .5s;pointer-events:none;}
  #result .big-btn.ready{opacity:1;pointer-events:auto;}
  @keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud" class="hide">
  <div class="l1">首の長さ <b id="len">0</b>m</div>
  <div class="l2">本人の移動距離 0m</div>
</div>
<div id="hint" class="hide"></div>
<button id="back" class="ui-btn hide">↩ ちぢめる</button>
<button id="mute" class="ui-btn">♪ ON</button>

<div id="title" class="screen">
  <h1>首を<span class="nb">長</span>くして待つ</h1>
  <div class="en">KUBI WO NAGAKU SHITE MATSU</div>
  <button id="start" class="big-btn">待ちはじめる</button>
  <div class="note">マウス・タッチ・矢印キーで頭を動かす<br>Space / 右クリック / ↩ボタンで首をちぢめる</div>
</div>

<div id="result" class="screen hide">
  <div class="card">
    <div class="r1">待ち合わせ成功！</div>
    <div class="r2">移動距離：0m</div>
    <div class="r3" id="res-len">首の長さ：0m</div>
    <div class="r4" id="res-time">待ち時間：0分0秒</div>
    <button id="again" class="big-btn">タイトルへ</button>
  </div>
</div>

<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const cv=$('cv'), g=cv.getContext('2d');
const el={hud:$('hud'),len:$('len'),hint:$('hint'),back:$('back'),mute:$('mute'),title:$('title'),
          start:$('start'),result:$('result'),resLen:$('res-len'),resTime:$('res-time'),again:$('again')};

/* =========================================================
   基本
   ========================================================= */
let W=0,H=0,DPR=1,S=1;
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=window.innerWidth; H=window.innerHeight;
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  // 横長なら高さ540、縦長なら高さ1000ぶんの世界が見える
  S=Math.max(H/1000,Math.min(W/960,H/540));
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',()=>setTimeout(resize,150));
resize();

const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>{t=clamp(t,0,1);return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;};
const easeOut=t=>{t=clamp(t,0,1);return 1-Math.pow(1-t,3);};
const easeBack=t=>{t=clamp(t,0,1);const c=2.2;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);};
const sm=t=>t<=0?0:t>=1?1:t*t*(3-2*t);
function hash(a,b){const s=Math.sin(a*127.1+b*311.7)*43758.5453;return s-Math.floor(s);}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hex2rgb(h){const n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255];}
function mix(a,b,t){const A=hex2rgb(a),B=hex2rgb(b);return'rgb('+A.map((v,i)=>Math.round(lerp(v,B[i],t))).join(',')+')';}
function rr(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function circ(x,y,r){g.beginPath();g.arc(x,y,r,0,Math.PI*2);}
function fmt(n){return Math.floor(n).toLocaleString('ja-JP');}

const GROUND=0, CEIL=-950, R=20, SP=8, NECK_W=15;
const ROOT={x:0,y:-84};
const WORLD_L=-250, WORLD_R=24150;
const MAXS=300;
const SKIN='#f7d4b5', LINE='#5b3d30', HAIR='#3b2a22';
const FONT='"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,sans-serif';

/* =========================================================
   音（Web Audio API で合成）
   ========================================================= */
const AU={ctx:null,master:null,music:null,sfx:null,noise:null,muted:false,stretch:null,stretchG:null};
function au(){
  if(!AU.ctx){
    try{
      const C=window.AudioContext||window.webkitAudioContext; AU.ctx=new C();
      AU.master=AU.ctx.createGain(); AU.master.gain.value=AU.muted?0:.7; AU.master.connect(AU.ctx.destination);
      AU.music=AU.ctx.createGain(); AU.music.gain.value=.32; AU.music.connect(AU.master);
      AU.sfx=AU.ctx.createGain(); AU.sfx.gain.value=.9; AU.sfx.connect(AU.master);
      const len=AU.ctx.sampleRate; const b=AU.ctx.createBuffer(1,len,AU.ctx.sampleRate); const d=b.getChannelData(0);
      for(let i=0;i<len;i++) d[i]=Math.random()*2-1; AU.noise=b;
      // 首が伸びる音（常時鳴らして音量で制御）
      const o=AU.ctx.createOscillator(); o.type='triangle'; o.frequency.value=200;
      const gn=AU.ctx.createGain(); gn.gain.value=0; o.connect(gn); gn.connect(AU.sfx); o.start();
      AU.stretch=o; AU.stretchG=gn;
    }catch(e){AU.ctx=null;}
  }
  if(AU.ctx&&AU.ctx.state==='suspended') AU.ctx.resume();
  return AU.ctx;
}
const mf=m=>440*Math.pow(2,(m-69)/12);
function tone(f,dur,o){
  const c=AU.ctx; if(!c) return; o=o||{};
  const t=(o.t!=null?o.t:c.currentTime)+(o.at||0);
  const osc=c.createOscillator(), gn=c.createGain();
  osc.type=o.type||'sine'; osc.frequency.setValueAtTime(f,t);
  if(o.to) osc.frequency.exponentialRampToValueAtTime(o.to,t+dur);
  if(o.vib){const l=c.createOscillator(),lg=c.createGain();l.frequency.value=o.vib[0];lg.gain.value=o.vib[1];
    l.connect(lg);lg.connect(osc.frequency);l.start(t);l.stop(t+dur+.05);}
  const v=o.vol||.2, a=o.attack||.008;
  gn.gain.setValueAtTime(0.0001,t); gn.gain.linearRampToValueAtTime(v,t+a);
  gn.gain.exponentialRampToValueAtTime(0.0005,t+dur);
  osc.connect(gn); gn.connect(o.bus||AU.sfx); osc.start(t); osc.stop(t+dur+.05);
}
function noise(dur,o){
  const c=AU.ctx; if(!c) return; o=o||{};
  const t=c.currentTime+(o.at||0);
  const s=c.createBufferSource(); s.buffer=AU.noise;
  const f=c.createBiquadFilter(); f.type=o.ft||'bandpass'; f.frequency.value=o.f||1000; f.Q.value=o.q||1;
  const gn=c.createGain(); const v=o.vol||.2, a=o.attack||.005;
  gn.gain.setValueAtTime(0.0001,t); gn.gain.linearRampToValueAtTime(v,t+a); gn.gain.exponentialRampToValueAtTime(0.0005,t+dur);
  s.connect(f); f.connect(gn); gn.connect(o.bus||AU.sfx); s.start(t,Math.random()*.5); s.stop(t+dur+.05);
}
const SFX={
  nyu(){tone(240,.38,{type:'triangle',to:1100,vol:.28});tone(480,.38,{to:2200,vol:.05});},
  boing(){tone(420,.5,{to:140,vol:.3,vib:[17,40]});},
  gon(){tone(150,.2,{type:'square',to:70,vol:.1});noise(.12,{ft:'lowpass',f:500,vol:.3});tone(95,.35,{vol:.3,to:60});},
  gwan(){tone(520,.8,{type:'triangle',vol:.12});tone(781,.7,{type:'triangle',vol:.08});tone(1203,.5,{vol:.04});noise(.08,{ft:'highpass',f:2000,vol:.1});},
  zap(){const c=AU.ctx;if(!c)return;const t=c.currentTime;const o=c.createOscillator(),gn=c.createGain(),l=c.createOscillator(),lg=c.createGain();
    o.type='sawtooth';o.frequency.value=82;l.type='square';l.frequency.value=34;lg.gain.value=.09;gn.gain.value=.09;
    l.connect(lg);lg.connect(gn.gain);o.connect(gn);gn.connect(AU.sfx);
    gn.gain.setValueAtTime(.09,t);gn.gain.linearRampToValueAtTime(0,t+.55);o.start(t);l.start(t);o.stop(t+.6);l.stop(t+.6);
    noise(.45,{ft:'highpass',f:3500,vol:.07});},
  fuwa(){tone(500,.45,{to:900,vol:.12,attack:.08});tone(750,.45,{to:1300,vol:.05,attack:.1});},
  fasa(){noise(.35,{f:1800,q:.7,vol:.3,attack:.04});tone(300,.2,{to:200,vol:.05});},
  peta(){noise(.08,{ft:'lowpass',f:900,vol:.22});},
  birds(){for(let i=0;i<5;i++) tone(2400+Math.random()*700,.06,{at:i*.07,to:3300+Math.random()*500,vol:.07});
    noise(.35,{f:1100,q:.6,vol:.12});},
  chirp(){tone(2800,.05,{to:3600,vol:.05});tone(3000,.05,{at:.09,to:3800,vol:.04});},
  shutter(){noise(.03,{ft:'highpass',f:4000,vol:.06});noise(.03,{at:.06,ft:'highpass',f:3000,vol:.05});},
  pop(){tone(700,.1,{to:1400,vol:.12});},
  talk(){tone(520+Math.random()*120,.05,{type:'square',vol:.025});},
  doh(){tone(1000,.95,{type:'sawtooth',to:110,vol:.14});tone(1400,.8,{type:'square',to:220,vol:.05});
    noise(.7,{f:900,q:.5,vol:.25});tone(70,.5,{vol:.35,to:40});},
  clear(){const c=AU.ctx;if(!c)return;[72,76,79,84].forEach((m,i)=>tone(mf(m),i===3?1.1:.22,{type:'triangle',at:i*.13,vol:.18}));
    [60,64,67].forEach(m=>tone(mf(m),1.2,{type:'triangle',at:.39,vol:.07}));}
};
// BGM：軽快で牧歌的な8小節ループ
const MEL=[76,0,79,0,81,79,76,0, 74,0,72,0,74,76,0,0, 72,0,74,76,77,0,76,74, 71,0,74,0,79,0,0,0,
           76,0,79,0,84,0,81,79, 76,0,74,76,79,0,0,0, 77,0,76,74,72,0,74,0, 72,0,0,0,0,0,0,0];
const CH=[[60,64,67],[57,60,64],[53,57,60],[55,59,62],[60,64,67],[52,55,59],[53,57,60],[60,64,67]];
const BGM={on:false,step:0,next:0,timer:null};
function bgmStart(){
  const c=au(); if(!c||BGM.on) return;
  BGM.on=true; BGM.step=0; BGM.next=c.currentTime+.1;
  BGM.timer=setInterval(()=>{
    const sd=60/112/2;
    while(BGM.next<AU.ctx.currentTime+.18){
      const s=BGM.step,t=BGM.next,m=MEL[s],bar=s>>3,b=s&7,ch=CH[bar];
      if(m){tone(mf(m),.26,{type:'triangle',t,vol:.13,bus:AU.music});tone(mf(m+12),.12,{t,vol:.02,bus:AU.music});}
      if(b===0||b===4) tone(mf(ch[0]-12-(b===4?5:0)),.34,{t,vol:.26,bus:AU.music});
      if(b===2||b===6) ch.forEach(n=>tone(mf(n),.13,{type:'square',t,vol:.022,bus:AU.music}));
      BGM.next+=sd; BGM.step=(s+1)%64;
    }
  },25);
}
function musicVol(v,tc){if(AU.ctx) AU.music.gain.setTargetAtTime(v,AU.ctx.currentTime,tc||.3);}
el.mute.addEventListener('click',e=>{
  e.stopPropagation(); AU.muted=!AU.muted; el.mute.textContent=AU.muted?'♪ OFF':'♪ ON';
  au(); if(AU.ctx) AU.master.gain.setTargetAtTime(AU.muted?0:.7,AU.ctx.currentTime,.05);
});

/* =========================================================
   首の軌跡（大量の点を扱うため、x座標でバケット分けして近傍検索）
   ========================================================= */
const T={x:[],y:[],L:[],bk:new Map()};
function tReset(){T.x.length=0;T.y.length=0;T.L.length=0;T.bk.clear();tPush(ROOT.x,ROOT.y);}
function tPush(x,y){
  const n=T.x.length; const L=n?T.L[n-1]+Math.hypot(x-T.x[n-1],y-T.y[n-1]):0;
  T.x.push(x);T.y.push(y);T.L.push(L);
  const k=Math.floor(x/64); let b=T.bk.get(k); if(!b){b=[];T.bk.set(k,b);} b.push(n);
}
function tPop(){
  const n=T.x.length-1; const b=T.bk.get(Math.floor(T.x[n]/64));
  if(b){const i=b.lastIndexOf(n); if(i>=0) b.splice(i,1);}
  T.x.pop();T.y.pop();T.L.pop();
}
function neckLen(){const n=T.x.length-1;return T.L[n]+Math.hypot(G.head.x-T.x[n],G.head.y-T.y[n]);}
// 表示上のメートル。伸びるほどスケール感がおかしくなっていく
function meters(L){const l=Math.max(0,L-34);return l/65*(1+l/3000);}
// x付近（±rx）にある首の点のうち、一番低い（地面に近い）y
function neckLowest(x,rx){
  let best=-1e9; const k0=Math.floor((x-rx)/64),k1=Math.floor((x+rx)/64);
  for(let k=k0;k<=k1;k++){const b=T.bk.get(k); if(!b) continue;
    for(let j=0;j<b.length;j++){const i=b[j]; if(Math.abs(T.x[i]-x)<rx&&T.y[i]>best) best=T.y[i];}}
  if(Math.abs(G.head.x-x)<rx&&G.head.y>best) best=G.head.y;
  return best;
}
function growTrail(){
  const h=G.head; let n=T.x.length;
  // 頭が首の上を引き返してきたら、その分ちぢむ
  while(n>3){const dx=h.x-T.x[n-2],dy=h.y-T.y[n-2]; if(dx*dx+dy*dy<SP*SP*.5){tPop();n--;} else break;}
  let lx=T.x[n-1],ly=T.y[n-1],d=Math.hypot(h.x-lx,h.y-ly);
  while(d>=SP){lx+=(h.x-lx)/d*SP;ly+=(h.y-ly)/d*SP;tPush(lx,ly);d-=SP;}
}

/* =========================================================
   街（ステージ）
   ========================================================= */
const solids=[], farB=[], trees=[], peds=[], flocks=[], cars=[], signs=[];
const rect=(x,y,w,h)=>({t:'r',x,y,w,h});
function sag(x1,y1,x2,y2,s,n){n=n||12;const p=[];for(let i=0;i<=n;i++){const t=i/n;p.push(lerp(x1,x2,t),lerp(y1,y2,t)+s*4*t*(1-t));}return p;}
function add(o){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const s of o.shapes){
    if(s.t==='r'){x0=Math.min(x0,s.x);y0=Math.min(y0,s.y);x1=Math.max(x1,s.x+s.w);y1=Math.max(y1,s.y+s.h);}
    else if(s.t==='c'){x0=Math.min(x0,s.x-s.r);y0=Math.min(y0,s.y-s.r);x1=Math.max(x1,s.x+s.r);y1=Math.max(y1,s.y+s.r);}
    else for(let i=0;i<s.pts.length;i+=2){x0=Math.min(x0,s.pts[i]-s.r);x1=Math.max(x1,s.pts[i]+s.r);
      y0=Math.min(y0,s.pts[i+1]-s.r);y1=Math.max(y1,s.pts[i+1]+s.r);}
  }
  o.bx0=x0;o.by0=y0;o.bx1=x1;o.by1=y1;
  if(o.vx0==null)o.vx0=x0; if(o.vx1==null)o.vx1=x1; if(o.vy0==null)o.vy0=y0; if(o.vy1==null)o.vy1=y1;
  o.layer=o.layer||1; solids.push(o); return o;
}
function bldg(x,w,y0,y1,o){
  o=o||{};
  return add(Object.assign({kind:'bldg',x,w,y0,y1,col:'#d8c3a8',style:'office',react:'bonk',
    shapes:[rect(x,y0,w,y1-y0)],watch:null,watchT:0,seed:x},o));
}
function pole(x,h){h=h||340;add({kind:'pole',x,h,react:'gon',shapes:[rect(x-7,-h,14,h),rect(x-32,-h+16,64,7)]});}
function wire(pts){add({kind:'wire',pts,react:'zap',layer:2,shapes:[{t:'s',pts,r:2}]});}
function poleRow(xs,h){
  h=h||340; xs.forEach(x=>pole(x,h));
  for(let i=0;i<xs.length-1;i++){const a=xs[i],b=xs[i+1];
    wire(sag(a+28,-h+16,b-28,-h+16,34)); wire(sag(a+7,-h+52,b-7,-h+52,46));}
}
function board(x,y,w,h,text,col,legs,tcol){
  const shapes=[rect(x,y,w,h)]; (legs||[]).forEach(l=>shapes.push(rect(l[0]-4,l[1],8,l[2]-l[1])));
  add({kind:'board',x,y,w,h,text,col,legs:legs||[],tcol:tcol||'#fff',react:'bonk',shapes});
}
function laundry(pts,items){
  // 洗濯ロープと洗濯物
  const clothes=[];
  for(let i=0;i<items;i++){const t=(i+1)/(items+1); const k=Math.floor(t*(pts.length/2-1));

/* =========================================================
   当たり判定
   ========================================================= */
function testShape(s,x,y,r){
  if(s.t==='r'){
    const cx=clamp(x,s.x,s.x+s.w),cy=clamp(y,s.y,s.y+s.h),dx=x-cx,dy=y-cy,d2=dx*dx+dy*dy;
    if(d2>=r*r) return null;
    if(d2>1e-6){const d=Math.sqrt(d2);return{nx:dx/d,ny:dy/d,pen:r-d};}
    const l=x-s.x,rt=s.x+s.w-x,tp=y-s.y,bt=s.y+s.h-y,m=Math.min(l,rt,tp,bt);
    if(m===l) return{nx:-1,ny:0,pen:l+r}; if(m===rt) return{nx:1,ny:0,pen:rt+r};
    if(m===tp) return{nx:0,ny:-1,pen:tp+r}; return{nx:0,ny:1,pen:bt+r};
  }
  if(s.t==='c'){
    const dx=x-s.x,dy=y-s.y,d=Math.hypot(dx,dy),rr2=r+s.r;
    if(d>=rr2) return null; const q=d||.001; return{nx:dx/q,ny:dy/q,pen:rr2-d};
  }
  let best=null; const p=s.pts,rs=r+s.r;
  for(let i=0;i<p.length-2;i+=2){
    const ax=p[i],ay=p[i+1],ex=p[i+2]-ax,ey=p[i+3]-ay,L2=ex*ex+ey*ey;
    const t=L2?clamp(((x-ax)*ex+(y-ay)*ey)/L2,0,1):0, dx=x-(ax+ex*t),dy=y-(ay+ey*t),d2=dx*dx+dy*dy;
    if(d2<rs*rs){const d=Math.sqrt(d2)||.001,pen=rs-d; if(!best||pen>best.pen) best={nx:dx/d,ny:dy/d,pen};}
  }
  return best;
}
function collide(){
  const h=G.head; let hit=null;
  for(let it=0;it<4;it++){
    let best=null;
    for(const o of solids){
      if(h.x+R<o.bx0||h.x-R>o.bx1||h.y+R<o.by0||h.y-R>o.by1) continue;
      for(const s of o.shapes){if(s.cloth&&!s.cloth.on) continue; const c=testShape(s,h.x,h.y,R); if(c&&(!best||c.pen>best.pen)){best=c;best.o=o;}}
    }
    if(!best) break;
    h.x+=best.nx*best.pen; h.y+=best.ny*best.pen;
    const vn=h.vx*best.nx+h.vy*best.ny;
    if(vn<0){h.vx-=1.5*vn*best.nx;h.vy-=1.5*vn*best.ny;}
    if(!hit||vn<hit.vn) hit={o:best.o,vn,nx:best.nx,ny:best.ny};
  }
  if(hit) onHit(hit);
  // 鳥の群れ
  for(const f of flocks) for(const b of f.birds){
    if(b.state!==0) continue;
    const dx=b.x-h.x,dy=b.y-h.y;
    if(dx*dx+dy*dy<(R+10)*(R+10)){
      b.state=1;b.t=0;b.vx=(dx>=0?1:-1)*(120+Math.random()*80);b.vy=-160-Math.random()*80;
      if(G.time-h.lastBird>.5){popup(h.x,h.y-30,'バサバサッ','#fff');SFX.birds();h.lastBird=G.time;}
      h.vx*=.6;h.vy*=.6;h.wob=Math.min(16,h.wob+4);G.perchQ++;
    }
  }
}
const BONK=['ボヨン','ポヨーン','ぼいん','ムニッ'];
function onHit(hit){
  const h=G.head,o=hit.o,imp=-hit.vn;
  if(imp<45) return;
  if(G.time-h.lastHit<(h.lastObj===o?1.1:.3)) return;
  h.lastHit=G.time; h.lastObj=o;
  h.vx+=hit.nx*150; h.vy+=hit.ny*150; h.stun=.32;
  h.wob=Math.min(18,h.wob+10); h.sqv+=4;
  const px=h.x-hit.nx*R, py=h.y-hit.ny*R;
  switch(o.react){
    case 'zap': SFX.zap(); h.zap=.7; popup(px,py,'ビリビリッ','#ffe14d',1.1); h.vx+=hit.nx*120; h.vy+=hit.ny*120; break;
    case 'laundry': {
      SFX.fasa(); let bc=null,bd=1e9;
      for(const c of o.clothes){if(!c.on) continue; const d=Math.hypot(c.x-h.x,c.y+22-h.y); if(d<bd){bd=d;bc=c;}}
      if(bc&&bd<60){bc.on=false; h.hat=bc; h.hatT=6; popup(px,py,'ファサッ','#fff');}
      else popup(px,py,'ピーン','#fff');
      break;}
    case 'gon': SFX.gon(); h.dizzy=1.1; popup(px,py,'ゴン！','#fff',1.1); G.shake=Math.max(G.shake,.25); break;
    case 'gwan': SFX.gwan(); h.dizzy=1.1; popup(px,py,'ガイーン','#ffd27a',1.1); G.shake=Math.max(G.shake,.3); break;
    default: SFX.boing(); h.dizzy=.8; popup(px,py,BONK[Math.floor(Math.random()*BONK.length)],'#fff'); break;
  }
}

function updateHeadAnim(dt,moving){
  const h=G.head;
  h.dizzy=Math.max(0,h.dizzy-dt); h.zap=Math.max(0,h.zap-dt); h.stun=Math.max(0,h.stun-dt);
  if(h.hat){h.hatT-=dt; if(h.hatT<=0){popup(h.x,h.y-20,'ひらり','#fff',.8); h.hat=null;}}
  h.wob*=Math.exp(-2.6*dt);
  // 頭のぷにぷに（ばね）
  h.sqv+=(-h.sq*120-h.sqv*9)*dt; h.sq+=h.sqv*dt;
  h.blinkT-=dt; if(h.blinkT<-.12) h.blinkT=2+Math.random()*3;
  const sp=Math.hypot(h.vx,h.vy);
  if(moving&&sp>30){h.lookX=lerp(h.lookX,h.vx/sp,dt*6);h.lookY=lerp(h.lookY,h.vy/sp,dt*6);
    if(h.vx>50) h.face=1; else if(h.vx<-50) h.face=-1;}
  h.tilt=lerp(h.tilt,clamp(h.vy*.0011,-.3,.3)*h.face,dt*5);
}
function updateWorld(dt){
  for(const p of peds) updatePed(p,dt);
  for(const c of cars){c.x+=c.dir*c.spd*dt; if(c.x>c.x1)c.x=c.x0; if(c.x<c.x0)c.x=c.x1;}
  for(const f of flocks) for(const b of f.birds){
    if(b.state===0){const a=G.time*.6*b.k+b.off;
      b.x=f.cx+Math.cos(a)*f.rx+Math.sin(G.time*1.3+b.off*3)*24; b.y=f.cy+Math.sin(a*1.4)*f.ry;}
    else{b.t+=dt;b.x+=b.vx*dt;b.y+=b.vy*dt;b.vy-=40*dt;}
  }
  // ビルの窓から首をかしげる人
  const h=G.head;
  for(const o of solids){
    if(o.kind!=='bldg'||o.style==='station') continue;
    if(h.x<o.x-260||h.x>o.x+o.w+260||h.y<o.y0-260||h.y>o.y1+260){o.watchT=Math.max(0,o.watchT-dt*2);continue;}
    const gr=winGrid(o);
    let c=Math.round((h.x-gr.ox-gr.ww/2)/gr.dx), r=Math.round((h.y-gr.oy-gr.wh/2)/gr.dy);
    c=clamp(c,0,gr.cols-1); r=clamp(r,0,gr.rows-1);
    if(!o.watch||o.watchT<=0) o.watch={c,r};
    o.watchT=Math.min(2,o.watchT+dt);
  }
}
function updatePed(p,dt){
  p.t+=dt; p.flash=Math.max(0,p.flash-dt*4);
  if(Math.abs(p.x-G.cam.x)>2600&&G.scene!=='ending') return;
  const low=neckLowest(p.x,26);
  p.duck=lerp(p.duck,low>p.base-92?1:0,Math.min(1,dt*8));
  if(p.state==='walk'){
    p.x+=p.dir*p.spd*dt*(1-.45*p.duck);
    if(p.x<p.x0)p.dir=1; if(p.x>p.x1)p.dir=-1;
    p.cool-=dt;
    if(p.cool<=0&&G.longNeck&&neckLowest(p.x,70)>p.base-420){
      p.st=0;p.cool=9;
      if(p.kind==='tourist'){p.state='photo';} else {p.state='look';}
    }
    p.look=lerp(p.look,0,dt*5); p.mark='';
  }else if(p.state==='look'){
    p.st+=dt;
    // 二度見：ちらっ→戻す→ガン見
    const a=p.st<.25?p.st/.25:p.st<.5?1-(p.st-.25)/.25:Math.min(1,(p.st-.5)/.12);
    p.look=a*(p.st<.5?.5:1);
    p.mark=p.st>.62?'!?':'';
    if(p.st>2.1){p.state='walk';p.mark='';}
  }else if(p.state==='photo'){
    p.st+=dt; p.look=lerp(p.look,.7,dt*6); p.mark='';
    if((p.st>.6&&p.st-dt<=.6)||(p.st>1.2&&p.st-dt<=1.2)||(p.st>1.8&&p.st-dt<=1.8)){p.flash=1;if(Math.abs(p.x-G.head.x)<900)SFX.shutter();}
    if(p.st>2.6) p.state='walk';
  }
}
function updatePerch(dt){
  const n=T.x.length;
  G.perch=G.perch.filter(b=>b.i<n-6);
  for(const b of G.perch) b.t+=dt;
  G.perchT+=dt;
  const m=meters(neckLen());
  if(((m>250&&G.perchT>5.5)||G.perchQ>0)&&n>80&&G.perch.length<32){
    G.perchT=0; if(G.perchQ>0)G.perchQ--;
    const i=n-1-Math.floor(30+Math.random()*Math.min(380,n-60));
    if(i>20&&!G.perch.some(b=>Math.abs(b.i-i)<4)){G.perch.push({i,t:0,c:Math.random()});if(Math.abs(T.x[i]-G.head.x)<700)SFX.chirp();}
  }
}

function camFollow(dt,zT){
  const h=G.head,c=G.cam;
  c.z=lerp(c.z,zT||1,Math.min(1,dt*2.5));
  const z=S*c.z,vw=W/z/2,vh=H/z/2;
  const tx=h.x+vw*.22;
  const top=CEIL-170,bot=GROUND+120;
  let ty=2*vh>=bot-top?bot-vh:clamp(h.y+30,top+vh,bot-vh);
  c.x=lerp(c.x,tx,Math.min(1,dt*4)); c.y=lerp(c.y,ty,Math.min(1,dt*3.5));
}

function control(dt){
  const h=G.head;
  let dvx=0,dvy=0,ctl=false;
  const kx=(K.r?1:0)-(K.l?1:0), ky=(K.d?1:0)-(K.u?1:0);
  const back=K.b||inp.back||inp.mback;
  if(back&&T.x.length>6){
    // 首をちぢめる：首の上をたどって戻る
    const n=T.x.length, tx=T.x[n-2], ty=T.y[n-2];
    const dx=tx-h.x,dy=ty-h.y,d=Math.hypot(dx,dy)||1;
    h.vx=dx/d*420; h.vy=dy/d*420;
    const st=Math.min(d,420*dt); h.x+=dx/d*st; h.y+=dy/d*st;
    growTrail(); G.idle=0;
    AU.retract=true;
    return true;
  }
  AU.retract=false;
  if(kx||ky){const d=Math.hypot(kx,ky);dvx=kx/d*MAXS*.92;dvy=ky/d*MAXS*.92;ctl=true;}
  else if(inp.active){
    const w=s2w(inp.px,inp.py),dx=w.x-h.x,dy=w.y-h.y,d=Math.hypot(dx,dy);
    if(d>10){const sp=Math.min(MAXS,(d-10)*3.2);dvx=dx/d*sp;dvy=dy/d*sp;ctl=true;}
  }
  const k=h.stun>0?1.8:7, ovx=h.vx,ovy=h.vy;
  h.vx+=(dvx-h.vx)*Math.min(1,k*dt); h.vy+=(dvy-h.vy)*Math.min(1,k*dt);
  h.wob=Math.min(14,h.wob+Math.hypot(h.vx-ovx,h.vy-ovy)*.015);
  h.x+=h.vx*dt; h.y+=h.vy*dt;
  collide();
  if(h.x<WORLD_L){h.x=WORLD_L;h.vx=Math.abs(h.vx)*.5;}
  if(h.x>WORLD_R){h.x=WORLD_R;h.vx=-Math.abs(h.vx)*.5;}
  if(h.y<CEIL+R){h.y=CEIL+R; if(h.vy<-60&&G.time-h.lastHit>.6){popup(h.x,h.y+10,'ふわっ','#fff');SFX.fuwa();h.lastHit=G.time;h.lastObj=null;} h.vy=Math.abs(h.vy)*.6+60;}
  if(h.y>GROUND-R){h.y=GROUND-R; if(h.vy>90&&G.time-h.lastHit>.6){popup(h.x,h.y-20,'ぺちっ','#fff',.8);SFX.peta();h.lastHit=G.time;h.lastObj=null;} h.vy=-Math.abs(h.vy)*.4;}
  growTrail();
  const sp=Math.hypot(h.vx,h.vy);
  if(sp>25){G.idle=0;G.moved+=sp*dt;} else G.idle+=dt;
  return ctl;
}

function update(dt){
  G.time+=dt; G.shake=Math.max(0,G.shake-dt*1.6);
  const h=G.head; let moving=false;
  G.longNeck=T.L[T.x.length-1]>90;
  updateWorld(dt);
  switch(G.scene){
  case 'title':{
    const c=G.cam, vw=W/(S*1.2)/2; c.x=lerp(c.x,-Math.min(60,vw*.15),dt*2); c.y=lerp(c.y,-150,dt*2); c.z=lerp(c.z,1.2,dt*2);
    h.x=0;h.y=-118+Math.sin(G.time*1.4)*.8;
    break;}
  case 'opening':{
    G.st+=dt; const t=G.st;
    const c=G.cam; c.x=lerp(c.x,40,dt*2); c.y=lerp(c.y,-170,dt*2); c.z=lerp(c.z,1.5,dt*2);
    if(t>.5&&t-dt<=.5) say('me','遅いなあ……',1.9);
    G.body.watch=t<2.4?0:t<3.0?ease((t-2.4)/.6):t<3.9?1:Math.max(0,1-(t-3.9)/.4);
    h.down=G.body.watch*.35;
    if(t>4.2&&t-dt<=4.2) say('me','首を長くして待つか……',2.1);
    if(t>6.6&&t-dt<=6.6){SFX.nyu(); h.sqv-=6;}
    if(t>6.6){const e=easeBack((t-6.6)/.6); h.x=lerp(0,14,e); h.y=lerp(-118,-235,e); growTrail();}
    if(t>6.7&&t-dt<=6.7) popup(30,-210,'にゅっ','#fff',1.6);
    if(t>7.6){
      G.scene='play'; G.st=0; h.down=0;
      el.hud.classList.remove('hide'); el.back.classList.remove('hide');
      showHint(inp.touch?'タッチで頭を動かす／↩で首をちぢめる':'マウス・矢印キーで頭を動かす／Space・右クリックで首をちぢめる');
      G.hintT=0;
    }
    break;}
  case 'play':{
    G.playTime+=dt; G.hintT+=dt;
    moving=control(dt);
    if(G.hintT>4&&G.moved>500) hideHint();
    const L=neckLen(),m=meters(L);
    for(const ms of G.msgs){if(!ms.done&&m>=ms.m&&!G.bubbles.some(b=>b.who==='me')){ms.done=true;say('me',ms.t,2.4);break;}}
    if(G.idle>7){G.idle=-6;say('me',['まだかなあ','遅いなあ','ふあ……','いい天気だなあ'][Math.floor(Math.random()*4)],2.2);}
    if(h.x>22500&&!G.sawWaiter){G.sawWaiter=true;say('me','あ、いた',1.8);}
    for(const p of G.pulls){if(!p.done&&h.x>p.x){p.done=true;startPull(p.msg);break;}}
    updatePerch(dt);
    camFollow(dt,1);
    // 待ち人に接近
    const w=G.waiter;
    if(w.state!=='shock'&&Math.hypot(h.x-(w.x-30),h.y-(-112))<150){startClimax();}
    break;}
  case 'pull':{
    const P=G.pull; P.t+=dt;
    h.vx*=Math.exp(-4*dt);h.vy*=Math.exp(-4*dt);h.x+=h.vx*dt;h.y+=h.vy*dt;collide();growTrail();
    const c=G.cam, inT=1.2,hold=3.6,out=4.7;
    if(P.t<inT){const e=ease(P.t/inT);c.x=lerp(P.f.x,P.to.x,e);c.y=lerp(P.f.y,P.to.y,e);c.z=Math.exp(lerp(Math.log(P.f.z),Math.log(P.to.z),e));}
    else if(P.t<hold){c.x=P.to.x;c.y=P.to.y;c.z=P.to.z; if(P.t-dt<1.5&&P.t>=1.5) say('me',P.msg,2.1);}
    else{
      const z=S,vw=W/z/2,vh=H/z/2,top=CEIL-170,bot=GROUND+120;
      const tx=h.x+vw*.22,ty=2*vh>=bot-top?bot-vh:clamp(h.y+30,top+vh,bot-vh);
      const e=ease((P.t-hold)/(out-hold));c.x=lerp(P.to.x,tx,e);c.y=lerp(P.to.y,ty,e);c.z=Math.exp(lerp(Math.log(P.to.z),0,e));
    }
    if(P.t>=out){G.scene='play';}
    updatePerch(dt);
    break;}
  case 'climax': updateClimax(dt); break;
  case 'ending': updateEnding(dt); break;
  case 'result':{G.st+=dt; break;}
  }
  // 待ち人
  updateWaiter(dt);
  updateHeadAnim(dt,moving);
  // 首の伸び音
  if(AU.ctx&&AU.stretchG){
    const sp=Math.hypot(h.vx,h.vy), on=(G.scene==='play'||G.scene==='pull')&&sp>40;
    const v=on?Math.min(.045,sp/MAXS*.045):0;
    AU.stretchG.gain.setTargetAtTime(v,AU.ctx.currentTime,.06);
    const f=AU.retract?180-Math.min(60,sp*.1)+Math.sin(G.time*40)*8:170+sp*.9+Math.sin(G.time*22)*14;
    AU.stretch.frequency.setTargetAtTime(f,AU.ctx.currentTime,.05);
  }
  // ポップアップ・吹き出し
  for(const p of G.popups) p.t+=dt; G.popups=G.popups.filter(p=>p.t<1.1);
  for(const b of G.bubbles) b.t+=dt; G.bubbles=G.bubbles.filter(b=>b.t<b.dur);
  if(G.big) G.big.t+=dt;
  if(G.scene==='play'||G.scene==='pull'||G.scene==='climax'){el.len.textContent=fmt(meters(neckLen()));}
}
// 引きの画：地面が画面の下のほうに来るように
function wideY(z){return Math.min((CEIL+GROUND)/2,GROUND+40-H/(S*z)*(H>W?.38:.24));}
function startPull(msg){
  const h=G.head,c=G.cam;
  const x0=-260,x1=h.x+300,y0=CEIL-200,y1=GROUND+140;
  const z=Math.min(W/S/(x1-x0),H/S/(y1-y0));
  G.pull={t:0,f:{x:c.x,y:c.y,z:c.z},to:{x:(x0+x1)/2,y:wideY(z),z},msg};
  G.scene='pull';
}
function updateWaiter(dt){
  const w=G.waiter; w.t+=dt;
  if(w.state==='walk'){
    if(w.x>23300) w.x-=14*dt; else w.state='stand';
  }else if(w.state==='shock'){
    w.vy+=1300*dt; w.y+=w.vy*dt; if(w.y>0){w.y=0;w.vy=0;if(w.t>.4)w.state='sit';}
  }
  if(w.phone){const p=w.phone;p.vy+=900*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=p.vr*dt;if(p.y>-4){p.y=-4;p.vy*=-.3;p.vx*=.6;p.vr*=.5;}}
}
function startClimax(){
  const h=G.head;
  G.scene='climax'; G.st=0; G.climax={sx:h.x,sy:h.y};
  h.vx=0;h.vy=0; hideHint(); el.back.classList.add('hide');
  musicVol(.08,.2);
}
function updateClimax(dt){
  G.st+=dt; const t=G.st,h=G.head,w=G.waiter,C=G.climax;
  const fx=w.x-46,fy=-114;
  if(t<.35){const e=easeBack(t/.35);h.x=lerp(C.sx,fx,e);h.y=lerp(C.sy,fy,e);growTrail();}
  else{h.x=fx;h.y=fy;}
  if(t>.0&&t-dt<=0){SFX.nyu();}
  if(t>.35&&t-dt<=.35){h.sqv-=7;popup(fx,fy-30,'にゅっ','#fff',1.4);}
  h.face=1; h.lookX=1;h.lookY=0; h.hat=null;
  if(t>.9&&t-dt<=.9) say('me','待ってたよ',1.45);
  if(t>2.4&&t-dt<=2.4){
    SFX.doh(); G.shake=1.4; G.big={text:'どひゃー！！',t:0};
    w.state='shock'; w.t=0; w.vy=-620; w.phone={x:w.x-8,y:-80,vx:180,vy:-520,r:0,vr:12};
  }
  const c=G.cam; c.x=lerp(c.x,w.x-40,dt*3); c.y=lerp(c.y,-150,dt*3); c.z=lerp(c.z,1.35,dt*2.5);
  if(t>5.0&&t-dt<=5.0) say('w','いや、普通に来ればよかったのに……',3.2);
  if(t>8.4){startEnding();}
}
function startEnding(){
  G.scene='ending'; G.st=0; const c=G.cam;
  const x0=-300,x1=G.waiter.x+300,y0=CEIL-220,y1=GROUND+160;
  const z=Math.min(W/S/(x1-x0),H/S/(y1-y0));
  G.end={f:{x:c.x,y:c.y,z:c.z},mid:{x:(x0+x1)/2,y:wideY(z),z},to:{x:0,y:-160,z:1.45},len:neckLen()};
  musicVol(.32,1);
}
function updateEnding(dt){
  G.st+=dt; const t=G.st,E=G.end,c=G.cam;
  const seg=(a,b,e)=>{c.x=lerp(a.x,b.x,e);c.y=lerp(a.y,b.y,e);c.z=Math.exp(lerp(Math.log(a.z),Math.log(b.z),e));};
  if(t<3.6) seg(E.f,E.mid,ease(t/3.6));
  else if(t<5.6) seg(E.mid,E.mid,0);
  else if(t<9.4) seg(E.mid,E.to,ease((t-5.6)/3.8));
  else seg(E.to,E.to,0);
  if(t>10.4&&t-dt<=10.4) showResult();
}
function showResult(){
  G.scene='result'; G.st=0; SFX.clear();
  const m=meters(G.end.len), s=Math.floor(G.playTime);
  el.resLen.textContent='首の長さ：'+fmt(m)+'m';
  el.resTime.textContent='待ち時間：'+Math.floor(s/60)+'分'+(s%60)+'秒';
  el.hud.classList.add('hide'); el.result.classList.remove('hide');
  setTimeout(()=>{if(G.scene==='result') el.again.classList.add('ready');},2600);
}

let V={x0:0,x1:0,y0:0,y1:0}, LOD=1;
function vis(x0,y0,x1,y1){return x1>=V.x0&&x0<=V.x1&&y1>=V.y0&&y0<=V.y1;}
const SKY0=['#79c1ec','#cfeefa'], SKY1=['#f0a868','#ffe2b8'];
function drawSky(){
  const p=sm((G.cam.x-12000)/11000)*.85;
  const gr=g.createLinearGradient(0,0,0,H);
  gr.addColorStop(0,mix(SKY0[0],SKY1[0],p)); gr.addColorStop(1,mix(SKY0[1],SKY1[1],p));
  g.fillStyle=gr; g.fillRect(0,0,W,H);
  // 遠くの山並み（パララックス）
  const a=clamp((G.cam.z-.45)/.35,0,1); if(a<=0) return;
  const sc=S*G.cam.z, gy=H/2+(0-G.cam.y)*sc, off=G.cam.x*.15;
  g.globalAlpha=a*.85; g.fillStyle=mix('#b9dccb','#e6c3a3',p); g.beginPath(); g.moveTo(0,H);
  for(let sx=0;sx<=W+24;sx+=24){const wx=sx/S+off; g.lineTo(sx,gy-(150+Math.sin(wx*.004)*70+Math.sin(wx*.013)*25)*S);}
  g.lineTo(W,H); g.closePath(); g.fill(); g.globalAlpha=1;
}
function drawFarBuildings(){
  const p=sm((G.cam.x-12000)/11000)*.85;
  const c1=mix('#b4c9dc','#d8b9a8',p), c2=mix('#a5bcd2','#cfae9c',p);
  for(const b of farB){
    if(!vis(b.x,-b.h,b.x+b.w,0)) continue;
    g.fillStyle=b.c<.5?c1:c2; g.fillRect(b.x,-b.h,b.w,b.h);
    if(LOD>.3){g.fillStyle='rgba(255,255,255,.22)';
      for(let y=-b.h+16;y<-20;y+=34) g.fillRect(b.x+8,y,b.w-16,6);}
  }
  for(const t of trees){
    if(!vis(t.x-60,-t.h-60,t.x+60,0)) continue;
    g.fillStyle='#8a6a4a'; g.fillRect(t.x-5,-t.h*.55,10,t.h*.55);
    g.fillStyle='#6fb36a'; circ(t.x,-t.h*.7,t.h*.36); g.fill(); circ(t.x-t.h*.25,-t.h*.55,t.h*.27); g.fill(); circ(t.x+t.h*.26,-t.h*.58,t.h*.28); g.fill();
  }
}
function winGrid(o){
  const dx=34,dy=42,cols=Math.max(1,Math.floor((o.w-14)/dx));
  return{cols,rows:Math.max(1,Math.floor((o.y1-o.y0-(o.y1===0?46:22))/dy)),ox:o.x+(o.w-cols*dx)/2+8,oy:o.y0+18,dx,dy,ww:18,wh:24};
}
function drawBldg(o){
  const h=o.y1-o.y0;
  g.fillStyle=o.col; g.fillRect(o.x,o.y0,o.w,h);
  g.fillStyle='rgba(0,0,0,.1)'; g.fillRect(o.x+o.w-12,o.y0,12,h);
  if(o.y1===0&&o.style!=='station'){g.fillStyle='rgba(0,0,0,.12)';g.fillRect(o.x,-10,o.w,10);}
  if(!o.noRoof){g.fillStyle='rgba(60,50,40,.35)';g.fillRect(o.x-4,o.y0-6,o.w+8,8);}
  if(o.y1!==0&&o.noRoof){g.fillStyle='rgba(0,0,0,.25)';g.fillRect(o.x,o.y1-8,o.w,8);}
  if(LOD>.3){
    const gr=winGrid(o);
    const r0=Math.max(0,Math.floor((V.y0-gr.oy)/gr.dy)-1), r1=Math.min(gr.rows-1,Math.ceil((V.y1-gr.oy)/gr.dy));
    const c0=Math.max(0,Math.floor((V.x0-gr.ox)/gr.dx)-1), c1=Math.min(gr.cols-1,Math.ceil((V.x1-gr.ox)/gr.dx));
    if(o.style==='shop'){
      g.fillStyle='#bfe0ef'; g.fillRect(o.x+20,-110,o.w-40,100);
      g.fillStyle='rgba(255,255,255,.5)'; g.fillRect(o.x+30,-104,40,88);
      for(let i=0;i<o.w;i+=36){g.fillStyle=(i/36)%2?'#fff':o.awn;g.beginPath();g.moveTo(o.x+i,-130);g.lineTo(o.x+i+36,-130);
        g.lineTo(o.x+i+36,-112);g.arc(o.x+i+18,-112,18,0,Math.PI);g.closePath();g.fill();}
      g.fillStyle='#3b2a22'; g.font='bold 30px '+FONT; g.textAlign='center'; g.fillText(o.name,o.x+o.w/2,-150);
    }else if(o.style==='station'){
      g.fillStyle='#7a8a99'; g.fillRect(o.x,-130,o.w,14);
      for(let i=0;i<5;i++){g.fillStyle='#cfe7f2';g.fillRect(o.x+40+i*110,-110,70,110);g.fillStyle='rgba(0,0,0,.2)';g.fillRect(o.x+74+i*110,-110,3,110);}
      g.fillStyle='#bfe0ef'; for(let i=0;i<8;i++) g.fillRect(o.x+24+i*72,-210,44,50);
    }else{
      for(let r=r0;r<=r1;r++){
        const wy=gr.oy+r*gr.dy;
        for(let c=c0;c<=c1;c++){
          const wx=gr.ox+c*gr.dx, hv=hash(o.seed+c,r);
          g.fillStyle=hv>.8?'#ffeaa6':'#a9d1e8'; g.fillRect(wx,wy,gr.ww,gr.wh);
          if(hv<.8){g.fillStyle='rgba(255,255,255,.55)';g.fillRect(wx+3,wy+3,4,gr.wh-6);}
          if(o.style==='apt'&&hv>.45&&hv<.62){g.fillStyle='#f6b8b8';g.fillRect(wx,wy,gr.ww/2,gr.wh);}
        }
        if(o.style==='apt'){g.fillStyle='rgba(80,70,60,.45)';g.fillRect(o.x+4,wy+gr.wh+5,o.w-8,4);}
      }
      if(o.y1===0){g.fillStyle='#6d5d50';g.fillRect(o.x+o.w/2-16,-42,32,42);g.fillStyle='#bfe0ef';g.fillRect(o.x+o.w/2-12,-38,10,30);g.fillRect(o.x+o.w/2+2,-38,10,30);}
      // 窓から覗く人
      if(o.watch&&o.watchT>0){

const NP={x:0,y:0};
function neckPt(i,Lt){
  let x=T.x[i],y=T.y[i]; const Li=T.L[i],toH=Lt-Li;
  const tp=sm(Li/160)*sm(toH/150);
  if(tp>0){const amp=Math.min(24,3+Lt/700)*tp; x+=Math.cos(G.time*.9+Li*.0031)*amp*.35; y+=Math.sin(G.time*1.25+Li*.0042)*amp;}
  const hw=G.head.wob;
  if(hw>.2&&toH<450){
    const a=hw*Math.exp(-toH/100)*Math.min(1,toH/24)*Math.sin(G.time*17-toH*.07);
    const j0=Math.max(0,i-1),j1=Math.min(T.x.length-1,i+1),dx=T.x[j1]-T.x[j0],dy=T.y[j1]-T.y[j0],d=Math.hypot(dx,dy)||1;
    x+=-dy/d*a; y+=dx/d*a;
  }
  NP.x=x;NP.y=y; return NP;
}
function drawNeck(){
  const n=T.x.length,Lt=neckLen(),h=G.head;
  const step=Math.max(1,Math.ceil(1.6/(SP*LOD)));
  const m=60,x0=V.x0-m,x1=V.x1+m,y0=V.y0-m,y1=V.y1+m;
  const p=new Path2D(); let prevIn=false,px=0,py=0,first=true;
  for(let i=0;i<n;i+=step){
    const j=(i+step>=n)?n-1:i;
    const q=neckPt(j,Lt),x=q.x,y=q.y,inV=x>x0&&x<x1&&y>y0&&y<y1;
    if(inV){ if(first) p.moveTo(x,y); else if(!prevIn){p.moveTo(px,py);p.lineTo(x,y);} else p.lineTo(x,y); }
    else if(prevIn) p.lineTo(x,y);
    prevIn=inV; px=x; py=y; first=false;
  }
  if(!prevIn) p.moveTo(px,py);
  p.lineTo(h.x,h.y);
  g.lineCap='round'; g.lineJoin='round';
  g.strokeStyle=LINE; g.lineWidth=Math.max(NECK_W+4.5,3.4/LOD); g.stroke(p);
  g.strokeStyle=SKIN; g.lineWidth=Math.max(NECK_W,1.8/LOD); g.stroke(p);
  if(LOD>.45){g.save(); g.translate(-1.5,-3); g.strokeStyle='rgba(255,255,255,.4)'; g.lineWidth=3.5; g.stroke(p); g.restore();}
}

    g.save(); g.translate(q.x,y); g.globalAlpha=Math.min(1,b.t*3);
    const bob=Math.sin(G.time*3+b.i)*.8;
    g.fillStyle=b.c<.5?'#9b7653':'#7d8a99'; g.beginPath(); g.ellipse(0,bob,9,7,0,0,Math.PI*2); g.fill();
    g.fillStyle='#f3e7d4'; g.beginPath(); g.ellipse(2,bob+2,5,4,0,0,Math.PI*2); g.fill();
    g.fillStyle=b.c<.5?'#9b7653':'#7d8a99'; circ(6,bob-6,5); g.fill();
    g.fillStyle='#222'; circ(7.5,bob-7,1.2); g.fill(); g.fillStyle='#f0a030'; g.beginPath(); g.moveTo(10.5,bob-6.5); g.lineTo(14,bob-5.5); g.lineTo(10.5,bob-4.5); g.fill();
    g.fillStyle='#5a4535'; g.beginPath(); g.moveTo(-8,bob); g.lineTo(-15,bob-4); g.lineTo(-14,bob+2); g.fill();
    if(b.t<.7){g.fillStyle='#5a4535';g.beginPath();g.ellipse(-2,bob-6,8,3,Math.sin(G.time*40)*.8,0,Math.PI*2);g.fill();}
    g.restore();
  }
}
function drawFlockBird(b){
  if(!vis(b.x-20,b.y-20,b.x+20,b.y+20)) return;
  const f=Math.sin(G.time*14+b.off*5);
  g.save(); g.translate(b.x,b.y); g.scale(b.state&&b.vx<0?-1:1,1);
  g.fillStyle='#4a4f5a'; g.beginPath(); g.ellipse(0,0,10,6,0,0,Math.PI*2); g.fill(); circ(8,-3,4.5); g.fill();
  g.fillStyle='#f0a030'; g.beginPath(); g.moveTo(12,-3); g.lineTo(16,-2); g.lineTo(12,-1); g.fill();
  g.strokeStyle='#4a4f5a'; g.lineWidth=3; g.lineCap='round'; g.beginPath(); g.moveTo(-2,-2); g.lineTo(-8,-2-f*10); g.stroke();
  g.restore();
}
function drawHead(x,y){
  const h=G.head;
  g.save(); g.translate(x,y); g.rotate(h.tilt+(h.down||0)*h.face);
  const sq=clamp(h.sq,-.25,.25); g.scale((1+sq)*h.face,1-sq);
  const zap=h.zap>0&&Math.floor(G.time*20)%2===0;
  g.fillStyle=zap?'#fff36b':LINE; circ(-1,0,22.6); g.fill();
  g.fillStyle=zap?'#333':HAIR; circ(-1,0,21); g.fill();
  if(zap){g.strokeStyle='#333';g.lineWidth=3;for(let a=0;a<8;a++){const r=a/8*Math.PI*2;g.beginPath();g.moveTo(Math.cos(r)*20,Math.sin(r)*20);g.lineTo(Math.cos(r)*30,Math.sin(r)*30);g.stroke();}}
  g.fillStyle=SKIN; g.beginPath(); g.ellipse(3.5,2.5,17,17,0,0,Math.PI*2); g.fill();
  g.fillStyle=zap?'#333':HAIR; g.beginPath(); g.moveTo(-21,2); g.quadraticCurveTo(-20,-23,3,-21.5); g.quadraticCurveTo(19,-20,21,-5);
  g.quadraticCurveTo(13,-12,6,-9); g.quadraticCurveTo(2,-14,-4,-8); g.quadraticCurveTo(-8,-2,-9,6); g.closePath(); g.fill();
  g.fillStyle=SKIN; circ(-7,5,4.5); g.fill(); g.strokeStyle=LINE; g.lineWidth=1.3; g.stroke();
  const lx=h.lookX*h.face*1.6,ly=h.lookY*1.4+(h.down||0)*6;
  g.fillStyle='#2a1f1a';
  if(h.dizzy>0){g.strokeStyle='#2a1f1a';g.lineWidth=1.6;
    for(const ex of[8,16]){g.beginPath();for(let a=0;a<10;a++){const r=a*.7+G.time*10,rad=a*.35;g.lineTo(ex+Math.cos(r)*rad,2+Math.sin(r)*rad);}g.stroke();}}
  else if(h.blinkT<0){g.fillRect(6+lx,2+ly,4.5,1.6);g.fillRect(14+lx,2+ly,4.5,1.6);}
  else{g.beginPath();g.ellipse(8+lx,2+ly,2.1,3,0,0,Math.PI*2);g.fill();g.beginPath();g.ellipse(16+lx,2+ly,2.1,3,0,0,Math.PI*2);g.fill();
    g.fillStyle='#fff';circ(8.6+lx,1+ly,.8);g.fill();circ(16.6+lx,1+ly,.8);g.fill();}
  g.fillStyle='rgba(255,140,140,.45)'; g.beginPath(); g.ellipse(5,10,3.6,2.2,0,0,Math.PI*2); g.fill(); g.beginPath(); g.ellipse(19,9,3,2,0,0,Math.PI*2); g.fill();
  g.strokeStyle='#7a3a2a'; g.lineWidth=1.5; g.beginPath(); g.arc(13,10,2.6,.15*Math.PI,.85*Math.PI); g.stroke();
  if(h.hat){g.save();g.translate(0,-30);g.rotate(-.15);drawCloth(0,0,h.hat,0);g.restore();}
  g.restore();
  if(h.dizzy>0){for(let i=0;i<3;i++){const a=G.time*5+i*2.09;drawStar(x+Math.cos(a)*24,y-26+Math.sin(a)*6,5);}}
}
function drawStar(x,y,r){g.fillStyle='#ffd84a';g.beginPath();for(let i=0;i<10;i++){const a=i/10*Math.PI*2-Math.PI/2,rr2=i%2?r*.45:r;g.lineTo(x+Math.cos(a)*rr2,y+Math.sin(a)*rr2);}g.closePath();g.fill();}
function drawWaiter(){
  const w=G.waiter; if(!vis(w.x-200,-300,w.x+200,10)) return;
  const shock=w.state==='shock', sit=w.state==='sit', walk=w.state==='walk';
  const ph=walk?Math.sin(w.t*5):0;
  g.save(); g.translate(w.x,w.y); g.scale(-1,1);
  g.fillStyle='rgba(0,0,0,.18)'; g.beginPath(); g.ellipse(0,2-w.y,24,5,0,0,Math.PI*2); g.fill();
  if(sit){
    g.strokeStyle='#5a4a3a'; g.lineWidth=9; g.lineCap='round';
    g.beginPath(); g.moveTo(-2,-20); g.lineTo(22,-14); g.lineTo(30,-2); g.moveTo(4,-20); g.lineTo(26,-24); g.lineTo(36,-6); g.stroke();
    g.translate(0,34);
  }else{
    g.strokeStyle='#5a4a3a'; g.lineWidth=9; g.lineCap='round';
    const sp=shock?14:ph*6;
    g.beginPath(); g.moveTo(-4,-42); g.lineTo(-4-sp,-4); g.moveTo(5,-42); g.lineTo(5+sp,-4); g.stroke();
  }
  g.fillStyle='#ef8b6c'; rr(-16,-88,32,50,10); g.fill(); g.strokeStyle=LINE; g.lineWidth=2.2; g.stroke();
  g.strokeStyle='#ef8b6c'; g.lineWidth=8; g.lineCap='round';
  if(shock||sit){g.beginPath();g.moveTo(-11,-80);g.lineTo(-30,-108);g.moveTo(11,-80);g.lineTo(30,-104);g.stroke();
    g.fillStyle=SKIN;circ(-31,-110,5);g.fill();circ(31,-106,5);g.fill();}
  else{g.beginPath();g.moveTo(10,-80);g.lineTo(18,-62);g.lineTo(14,-74);g.stroke();
    g.fillStyle='#333';rr(9,-86,10,15,2);g.fill();g.fillStyle='#bfefff';g.fillRect(10.5,-84,7,11);
    g.fillStyle='rgba(190,240,255,.35)';g.beginPath();g.moveTo(14,-80);g.lineTo(24,-108);g.lineTo(6,-108);g.closePath();g.fill();
    g.fillStyle=SKIN;circ(16,-72,5);g.fill();}
  // 頭
  g.save(); g.translate(0,-114); if(!shock&&!sit) g.rotate(.32); if(sit) g.rotate(-.1);
  const sc=shock?1.12:1; g.scale(sc,sc);
  g.fillStyle=LINE; circ(-1,0,21.6); g.fill(); g.fillStyle='#7a4a2a'; circ(-1,0,20); g.fill();
  if(shock){g.strokeStyle='#7a4a2a';g.lineWidth=5;g.lineCap='round';for(let a=-5;a<=1;a++){const r=a*.42-1.0;g.beginPath();g.moveTo(Math.cos(r)*14,Math.sin(r)*14);g.lineTo(Math.cos(r)*34,Math.sin(r)*34);g.stroke();}}
  g.fillStyle='#7a4a2a'; circ(-20,6,8); g.fill();
  g.fillStyle=SKIN; g.beginPath(); g.ellipse(3.5,3,16,16,0,0,Math.PI*2); g.fill();
  g.fillStyle='#7a4a2a'; g.beginPath(); g.moveTo(-20,0); g.quadraticCurveTo(-16,-22,6,-20); g.quadraticCurveTo(20,-16,20,-4); g.quadraticCurveTo(8,-12,-8,-4); g.closePath(); g.fill();
  if(shock){
    g.fillStyle='#fff'; g.strokeStyle='#222'; g.lineWidth=1.5;
    circ(8,0,6.5); g.fill(); g.stroke(); circ(18,0,6); g.fill(); g.stroke();
    g.fillStyle='#222'; circ(7,0,2); g.fill(); circ(17,0,2); g.fill();
    g.fillStyle='#7a2020'; g.beginPath(); g.ellipse(13,13,5,6.5,0,0,Math.PI*2); g.fill();
    g.fillStyle='rgba(120,160,255,.7)'; g.beginPath(); g.moveTo(-2,-10); g.lineTo(2,-2); g.lineTo(-4,-4); g.fill();
  }else if(sit){
    g.strokeStyle='#222'; g.lineWidth=1.6; g.beginPath(); g.moveTo(5,1); g.lineTo(11,1); g.moveTo(15,1); g.lineTo(21,1); g.stroke();
    g.beginPath(); g.moveTo(10,12); g.lineTo(17,11); g.stroke();
  }else{
    g.fillStyle='#222'; g.fillRect(6,4,4,1.8); g.fillRect(15,4,4,1.8);
    g.strokeStyle='#7a3a2a'; g.lineWidth=1.4; g.beginPath(); g.moveTo(10,12); g.lineTo(15,12); g.stroke();
  }
  g.restore();
  g.restore();
  if(w.phone){const p=w.phone; g.save(); g.translate(p.x,p.y); g.rotate(p.r); g.fillStyle='#333'; rr(-5,-8,10,16,2); g.fill(); g.fillStyle='#bfefff'; g.fillRect(-3.5,-6,7,12); g.restore();}
}
function drawClouds(){
  if(!vis(V.x0,CEIL-150,V.x1,CEIL+60)) return;
  g.fillStyle='rgba(255,255,255,.55)'; g.fillRect(V.x0-20,V.y0-20,V.x1-V.x0+40,Math.max(0,CEIL-60-V.y0+20));
  g.fillStyle='#fff';
  if(LOD<.15){g.fillRect(V.x0-20,CEIL-80,V.x1-V.x0+40,90);return;}
  const s0=Math.floor(V.x0/70)-2,s1=Math.ceil(V.x1/70)+2;
  for(let i=s0;i<=s1;i++){const x=i*70,r=40+hash(i,1)*34,y=CEIL-40+hash(i,2)*30+Math.sin(G.time*.5+i)*3; circ(x,y,r); g.fill();}
  g.fillRect(V.x0-20,CEIL-90,V.x1-V.x0+40,50);
}
function drawBubble(sx,sy,text,a,isMe){
  const fs=clamp(17*S,14,28); g.font='bold '+fs+'px '+FONT;
  const tw=g.measureText(text).width, pw=tw+fs*1.2, ph=fs*1.9;
  let bx=clamp(sx-pw/2,8,W-pw-8), by=sy-ph-fs*.8;
  if(by<8) by=8;
  g.globalAlpha=a;
  g.fillStyle=isMe?'#fffef6':'#fff'; g.strokeStyle='#2b3440'; g.lineWidth=2.5;
  rr(bx,by,pw,ph,ph*.45); g.fill(); g.stroke();
  const tx=clamp(sx,bx+ph*.5,bx+pw-ph*.5);
  g.beginPath(); g.moveTo(tx-fs*.4,by+ph-1); g.lineTo(clamp(sx,tx-fs,tx+fs),Math.min(sy-4,by+ph+fs*.8)); g.lineTo(tx+fs*.3,by+ph-1); g.closePath(); g.fill(); g.stroke();
  g.fillStyle=isMe?'#fffef6':'#fff'; g.fillRect(tx-fs*.4+2,by+ph-4,fs*.7-2,5);
  g.fillStyle='#2b3440'; g.textAlign='center'; g.textBaseline='middle'; g.fillText(text,bx+pw/2,by+ph/2+1);
  g.textBaseline='alphabetic'; g.globalAlpha=1;
}
function render(){
  const c=G.cam, sc=S*c.z;
  const sh=G.shake>0?G.shake*10:0, shx=(Math.random()-.5)*sh, shy=(Math.random()-.5)*sh;
  g.setTransform(DPR,0,0,DPR,0,0);
  drawSky();
  LOD=sc;
  const cx=c.x+shx/sc, cy=c.y+shy/sc;
  V={x0:cx-W/2/sc,x1:cx+W/2/sc,y0:cy-H/2/sc,y1:cy+H/2/sc};
  g.setTransform(DPR*sc,0,0,DPR*sc,DPR*(W/2-cx*sc),DPR*(H/2-cy*sc));
  drawFarBuildings();
  drawSlitBack();
  for(const o of solids) if(o.layer===1&&vis(o.vx0,o.vy0,o.vx1,o.vy1)) drawSolid(o);
  for(const o of solids) if(o.layer===2&&vis(o.vx0-10,o.vy0-10,o.vx1+10,o.vy1+60)) drawSolid(o);
  drawGround();
  for(const s of signs) drawSign(s);
  for(const k of cars) drawCar(k);
  G.marks.length=0;
  if(LOD>.18) for(const p of peds) drawPed(p);
  drawWaiter();
  if(vis(-60,-140,60,10)){g.save();drawProtagBody();g.restore();}
  drawNeck();
  if(vis(-60,-140,60,10)) drawCollar();
  drawPerched();
  for(const f of flocks) for(const b of f.birds) if(b.state===0||b.t<4) drawFlockBird(b);
  const h=G.head;
  if(LOD>.12) drawHead(h.x,h.y);
  else{g.fillStyle=HAIR;circ(h.x,h.y,Math.max(R,4/LOD));g.fill();}
  drawClouds();
  // 画面座標での文字
  g.setTransform(DPR,0,0,DPR,0,0);
  for(const m of G.marks){const s=w2s(m.x,m.y);const fs=clamp(18*sc,11,30);g.font='bold '+fs+'px '+FONT;g.textAlign='center';
    g.lineWidth=4;g.strokeStyle='#fff';g.strokeText(m.text,s.x,s.y);g.fillStyle='#d6402f';g.fillText(m.text,s.x,s.y);}
  for(const p of G.popups){
    const s=w2s(p.x,p.y), e=easeOut(p.t/.3), fs=clamp(26*S*p.size*(.6+.4*e),16,64);
    g.globalAlpha=p.t>.75?1-(p.t-.75)/.35:1;
    g.font='bold '+fs+'px '+FONT; g.textAlign='center';
    const x=s.x+p.dx*e*S, y=s.y-46*S*e-p.t*20*S;
    g.lineWidth=fs*.22; g.strokeStyle='#2b3440'; g.lineJoin='round'; g.strokeText(p.text,x,y); g.fillStyle=p.col; g.fillText(p.text,x,y);
    g.globalAlpha=1;
  }
  for(const b of G.bubbles){
    let ax,ay;
    if(b.who==='me'){ax=h.x;ay=h.y-26;} else {ax=G.waiter.x;ay=G.waiter.y-145+(G.waiter.state==='sit'?34:0);}
    const s=w2s(ax,ay); const a=Math.min(1,b.t*6,(b.dur-b.t)*4);
    drawBubble(s.x,s.y,b.text,a,b.who==='me');
  }
  if(G.big){
    const t=G.big.t, a=t<2.6?1:Math.max(0,1-(t-2.6)/.5);
    if(a>0){
      const fs=Math.min(W/6.2,H/3.6)*(1+.25*Math.max(0,1-t*4)), j=Math.max(0,1-t/1.6)*10;
      g.save(); g.globalAlpha=a; g.translate(W/2+(Math.random()-.5)*j,H*.32+(Math.random()-.5)*j); g.rotate(-.06);
      g.font='900 '+fs+'px '+FONT; g.textAlign='center'; g.textBaseline='middle';
      g.lineJoin='round'; g.lineWidth=fs*.2; g.strokeStyle='#2b3440'; g.strokeText(G.big.text,0,0);
      g.fillStyle='#ffde3b'; g.fillText(G.big.text,0,0); g.restore(); g.textBaseline='alphabetic';
      // 集中線
      if(t<1.4){g.save();g.globalAlpha=.35*(1-t/1.4);g.strokeStyle='#2b3440';g.lineWidth=3;
        for(let i=0;i<40;i++){const r=i/40*Math.PI*2+hash(i,Math.floor(t*12))*.1,r0=Math.min(W,H)*.42,r1=Math.max(W,H);
          g.beginPath();g.moveTo(W/2+Math.cos(r)*r0,H/2+Math.sin(r)*r0);g.lineTo(W/2+Math.cos(r)*r1,H/2+Math.sin(r)*r1);g.stroke();}
        g.restore();}
    }
  }
  // エンディング中の首の長さ表示
  if(G.scene==='ending'&&G.st>2&&G.st<9){
    const a=Math.min(1,(G.st-2)*2,(9-G.st)*2), fs=clamp(24*S,16,40);
    g.globalAlpha=a; g.font='bold '+fs+'px '+FONT; g.textAlign='center';
    const txt='首の長さ '+fmt(meters(G.end.len))+'m';
    g.lineWidth=fs*.25; g.strokeStyle='#fff'; g.lineJoin='round'; g.strokeText(txt,W/2,H-fs*1.6); g.fillStyle='#2b3440'; g.fillText(txt,W/2,H-fs*1.6);
    g.globalAlpha=1;
  }
}

/* =========================================================
   ループ
   ========================================================= */
let last=performance.now();
function frame(now){
  let dt=(now-last)/1000; last=now;
  if(dt>.05) dt=.05; if(dt<0) dt=0;
  try{update(dt);render();}catch(e){console.error(e);}
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange',()=>{
  if(!AU.ctx) return;
  if(document.hidden) AU.ctx.suspend(); else AU.ctx.resume();
  last=performance.now();
});
requestAnimationFrame(frame);
})();
</script>
