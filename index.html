<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>受身 ― 受身練習ソフト</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{width:100%;height:100%;background:#0d1116;overflow:hidden;
    font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","YuGothic",Meiryo,system-ui,sans-serif;
    color:#fff;-webkit-user-select:none;user-select:none;}
  #stage{position:fixed;inset:0;overflow:hidden;}
  #wrap{position:absolute;left:50%;top:50%;width:960px;height:540px;
        transform:translate(-50%,-50%);transform-origin:50% 50%;
        background:#000;overflow:hidden;box-shadow:0 0 40px rgba(0,0,0,.8);font-size:16px;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}
  #ui{position:absolute;inset:0;pointer-events:none;}

  .hud{position:absolute;top:1.1em;left:1.3em;font-size:.95em;letter-spacing:.08em;
       text-shadow:0 .12em .3em rgba(0,0,0,.6);opacity:.95;}
  .hud b{font-size:1.35em;font-weight:700;margin-right:.5em;}
  .hud span{font-size:1.05em;font-weight:600;}
  #hint{position:absolute;left:0;right:0;bottom:1.5em;text-align:center;
        font-size:1.25em;font-weight:600;letter-spacing:.06em;
        text-shadow:0 .12em .35em rgba(0,0,0,.75);}
  #hint small{display:block;margin-top:.5em;font-size:.62em;font-weight:400;opacity:.75;letter-spacing:.14em;}
  #mute{position:absolute;top:.9em;right:1em;pointer-events:auto;cursor:pointer;
        font-size:.85em;padding:.45em .8em;border:1px solid rgba(255,255,255,.35);
        border-radius:2em;background:rgba(0,0,0,.25);color:#fff;letter-spacing:.08em;}

  .screen{position:absolute;inset:0;display:flex;flex-direction:column;
          align-items:center;justify-content:center;text-align:center;padding:2em;}
  .screen.hide{display:none;}
  #s-title{background:linear-gradient(180deg,#12324f 0%,#0d2136 100%);pointer-events:auto;}
  #s-title h1{font-size:5.6em;font-weight:800;letter-spacing:.3em;text-indent:.3em;
              margin-bottom:.12em;text-shadow:0 .06em .2em rgba(0,0,0,.5);}
  #s-title .sub{font-size:1.1em;letter-spacing:.35em;text-indent:.35em;opacity:.8;margin-bottom:2.4em;}
  .btn{pointer-events:auto;cursor:pointer;font-family:inherit;font-weight:700;
       font-size:1.5em;letter-spacing:.2em;text-indent:.2em;padding:.7em 2.4em;border:none;border-radius:.3em;
       background:#f4f4ee;color:#16324c;box-shadow:0 .18em 0 #b9b9ae;transition:transform .08s;}
  .btn:active{transform:translateY(.1em);box-shadow:0 .08em 0 #b9b9ae;}
  #s-title .note{margin-top:2.2em;font-size:.92em;line-height:1.9;opacity:.72;}

  #s-msg{background:rgba(6,12,20,.62);backdrop-filter:blur(2px);}
  #s-msg.clear-bg{background:rgba(6,12,20,.28);backdrop-filter:none;}
  #msg-sub{font-size:1.15em;letter-spacing:.34em;text-indent:.34em;opacity:.85;margin-bottom:.5em;}
  #msg-main{font-size:3.4em;font-weight:800;letter-spacing:.12em;text-indent:.12em;
            text-shadow:0 .06em .25em rgba(0,0,0,.55);}
  #msg-badge{margin-top:.55em;font-size:1.9em;font-weight:800;letter-spacing:.22em;text-indent:.22em;}
  #msg-tip{margin-top:1.3em;font-size:1.15em;line-height:1.8;opacity:.9;max-width:26em;}
  #msg-go{margin-top:1.8em;font-size:.9em;letter-spacing:.2em;opacity:.65;}
  .badge-p{color:#ffe27a;text-shadow:0 0 .5em rgba(255,214,64,.6);}
  .badge-g{color:#9fe8b0;}

  #s-end{background:linear-gradient(180deg,#bfe4f5 0%,#eef6e6 60%,#f7f3e4 100%);color:#123;pointer-events:auto;}
  #s-end .lead{font-size:1.7em;font-weight:700;letter-spacing:.1em;margin-bottom:.9em;}
  #s-end .end{font-size:6em;font-weight:800;letter-spacing:.42em;text-indent:.42em;margin-bottom:.35em;color:#16324c;}
  #s-end .rank{font-size:1em;letter-spacing:.14em;opacity:.75;margin-bottom:2.2em;}
  #s-end .btn{background:#16324c;color:#fff;box-shadow:0 .18em 0 #0b1c2c;font-size:1.25em;}
  #s-end .foot{margin-top:1.8em;font-size:.85em;opacity:.6;letter-spacing:.1em;}

  .fadein{animation:fi .35s ease both;}
  @keyframes fi{from{opacity:0;transform:translateY(.5em);}to{opacity:1;transform:none;}}
</style>
</head>
<body>
<div id="stage"><div id="wrap">
  <canvas id="cv"></canvas>
  <div id="ui">
    <div class="hud hide" id="hud"><b id="hud-lv">LEVEL 1</b><span id="hud-name">転倒</span></div>
    <div id="hint" class="hide"></div>
    <div id="mute">♪ ON</div>

    <div class="screen" id="s-title">
      <h1>受身</h1>
      <div class="sub">U K E M I  P R A C T I C E</div>
      <button class="btn" id="btn-start">START</button>
      <div class="note">
        地面に着く瞬間に、Space キー または 画面タップで受身を取ります。<br>
        正しいタイミングで受身を取れば、身体は守られます。
      </div>
    </div>

    <div class="screen hide" id="s-msg">
      <div id="msg-sub"></div>
      <div id="msg-main"></div>
      <div id="msg-badge"></div>
      <div id="msg-tip"></div>
      <div id="msg-go"></div>
    </div>

    <div class="screen hide" id="s-end">
      <div class="lead">受身を覚えておけば安心ですね！</div>
      <div class="end">END</div>
      <div class="rank" id="end-rank"></div>
      <button class="btn" id="btn-again">もう一度受身を練習する</button>
      <div class="foot">受身練習ソフト「受身」</div>
    </div>
  </div>
</div></div>

<script>
(function(){
"use strict";
const W=960,H=540;
const cv=document.getElementById('cv'), g=cv.getContext('2d');
const wrap=document.getElementById('wrap');
const el={
  hud:document.getElementById('hud'), hudLv:document.getElementById('hud-lv'), hudName:document.getElementById('hud-name'),
  hint:document.getElementById('hint'), mute:document.getElementById('mute'),
  title:document.getElementById('s-title'), msg:document.getElementById('s-msg'), end:document.getElementById('s-end'),
  sub:document.getElementById('msg-sub'), main:document.getElementById('msg-main'),
  badge:document.getElementById('msg-badge'), tip:document.getElementById('msg-tip'), go:document.getElementById('msg-go'),
  rank:document.getElementById('end-rank')
};

/* ---------- resize ---------- */
function resize(){
  const vw=window.innerWidth, vh=window.innerHeight;
  const portrait=vh>vw*1.08;               // 縦持ちのときは横向きに回して大きく表示
  const aw=portrait?vh:vw, ah=portrait?vw:vh;
  const w=Math.min(aw, ah*W/H), h=w*H/W;
  wrap.style.width=w+'px'; wrap.style.height=h+'px';
  wrap.style.transform='translate(-50%,-50%)'+(portrait?' rotate(90deg)':'');
  wrap.style.fontSize=(w/W*16)+'px';
  const dpr=Math.min(window.devicePixelRatio||1,2);
  const cw=Math.round(W*dpr), chh=Math.round(H*dpr);
  if(cv.width!==cw||cv.height!==chh){ cv.width=cw; cv.height=chh; }
  g.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',()=>setTimeout(resize,120));

/* ---------- audio ---------- */
const A={ctx:null,on:true,windGain:null,windSrc:null,bgmTimer:null};
function ac(){ if(!A.ctx){ try{A.ctx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} }
  if(A.ctx&&A.ctx.state==='suspended') A.ctx.resume(); return A.ctx; }
function noiseBuf(sec){
  const c=ac(); const n=Math.floor(c.sampleRate*sec); const b=c.createBuffer(1,n,c.sampleRate);
  const d=b.getChannelData(0); for(let i=0;i<n;i++) d[i]=Math.random()*2-1; return b;
}
function slap(power){ // 受身音
  const c=ac(); if(!c||!A.on) return; const t=c.currentTime;
  const p=Math.max(1,power);
  const src=c.createBufferSource(); src.buffer=noiseBuf(0.5);
  const bp=c.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1500-160*p; bp.Q.value=0.7;
  const gg=c.createGain(); gg.gain.setValueAtTime(0.0001,t);
  gg.gain.exponentialRampToValueAtTime(Math.min(0.9,0.34+0.13*p),t+0.006);
  gg.gain.exponentialRampToValueAtTime(0.0001,t+0.12+0.09*p);
  src.connect(bp); bp.connect(gg); gg.connect(c.destination); src.start(t); src.stop(t+0.7);
  // 低音の衝撃
  const o=c.createOscillator(), og=c.createGain();
  o.type='sine'; o.frequency.setValueAtTime(150-14*p,t); o.frequency.exponentialRampToValueAtTime(34,t+0.25+0.1*p);
  og.gain.setValueAtTime(0.0001,t); og.gain.exponentialRampToValueAtTime(0.28+0.14*p,t+0.01);
  og.gain.exponentialRampToValueAtTime(0.0001,t+0.4+0.22*p);
  o.connect(og); og.connect(c.destination); o.start(t); o.stop(t+0.9+0.3*p);
  if(p>=3){ // 大きな余韻
    const s2=c.createBufferSource(); s2.buffer=noiseBuf(2.2);
    const lp=c.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=420;
    const g2=c.createGain(); g2.gain.setValueAtTime(0.35,t+0.02); g2.gain.exponentialRampToValueAtTime(0.0001,t+2.0);
    s2.connect(lp); lp.connect(g2); g2.connect(c.destination); s2.start(t+0.02); s2.stop(t+2.3);
  }
}
function beep(freq,dur,type,vol,delay){
  const c=ac(); if(!c||!A.on) return; const t=c.currentTime+(delay||0);
  const o=c.createOscillator(), gg=c.createGain();
  o.type=type||'triangle'; o.frequency.value=freq;
  gg.gain.setValueAtTime(0.0001,t); gg.gain.exponentialRampToValueAtTime(vol||0.14,t+0.02);
  gg.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(gg); gg.connect(c.destination); o.start(t); o.stop(t+dur+0.05);
}
function sfxOk(perfect){ if(perfect){beep(1046,0.16,'triangle',0.13,0.05);beep(1568,0.3,'triangle',0.12,0.16);}
  else {beep(784,0.16,'triangle',0.11,0.05);beep(1046,0.26,'triangle',0.1,0.16);} }
function sfxFail(){ beep(320,0.2,'sine',0.1,0); beep(240,0.34,'sine',0.09,0.14); }
function sfxCar(){ const c=ac(); if(!c||!A.on) return; const t=c.currentTime;
  const o=c.createOscillator(),gg=c.createGain(); o.type='sawtooth';
  o.frequency.setValueAtTime(190,t); o.frequency.linearRampToValueAtTime(120,t+0.9);
  gg.gain.setValueAtTime(0.0001,t); gg.gain.linearRampToValueAtTime(0.1,t+0.5); gg.gain.linearRampToValueAtTime(0.0001,t+1.1);
  o.connect(gg); gg.connect(c.destination); o.start(t); o.stop(t+1.2); }
function windStart(){ const c=ac(); if(!c||!A.on||A.windSrc) return;
  const s=c.createBufferSource(); s.buffer=noiseBuf(2.5); s.loop=true;
  const f=c.createBiquadFilter(); f.type='lowpass'; f.frequency.value=900;
  const gg=c.createGain(); gg.gain.value=0.0001;
  s.connect(f); f.connect(gg); gg.connect(c.destination); s.start();
  A.windSrc=s; A.windGain=gg; }
function windSet(v){ if(A.windGain&&A.ctx) A.windGain.gain.setTargetAtTime(A.on?Math.max(0.0001,v):0.0001,A.ctx.currentTime,0.12); }
function windStop(){ if(A.windSrc){ try{A.windSrc.stop();}catch(e){} A.windSrc=null; A.windGain=null; } }
const MEL=[523,659,784,880,784,659,587,659];
function bgmLoop(){
  if(!A.on) return;
  MEL.forEach((f,i)=>{ beep(f,0.34,'triangle',0.075,i*0.34); beep(f/2,0.3,'sine',0.05,i*0.34); });
  A.bgmTimer=setTimeout(bgmLoop,MEL.length*340);
}
function bgmStop(){ if(A.bgmTimer){clearTimeout(A.bgmTimer);A.bgmTimer=null;} }
el.mute.addEventListener('click',(e)=>{ e.stopPropagation(); A.on=!A.on; el.mute.textContent=A.on?'♪ ON':'♪ OFF';
  if(!A.on){ windSet(0); bgmStop(); } });

/* ---------- fx ---------- */
const fx={dust:[],shake:0,flash:0,pop:null};
function shake(v){ fx.shake=Math.max(fx.shake,v); }
function flash(v){ fx.flash=Math.max(fx.flash,v); }
function dust(x,y,n,power,col,slow){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, sp=(0.4+Math.random())*power*70;
    fx.dust.push({x:x+(Math.random()-0.5)*76*power,y:y,
      vx:Math.cos(a)*sp*(0.6+Math.random()), vy:-Math.abs(Math.sin(a))*sp*0.55-20*power,
      r:(8+Math.random()*20)*Math.sqrt(power), life:1, dec:(0.5+Math.random()*0.5)/(slow||1),
      col:col||'rgba(214,206,190,'});
  }
}
function popText(txt,size,col){ fx.pop={t:0,txt:txt,size:size||70,col:col||'#fff'}; }
function fxUpdate(dt){
  fx.shake=Math.max(0,fx.shake-dt*36);
  fx.flash=Math.max(0,fx.flash-dt*3.2);
  for(let i=fx.dust.length-1;i>=0;i--){
    const p=fx.dust[i];
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=120*dt; p.vx*=0.97; p.r+=26*dt;
    p.life-=dt*p.dec*0.75; if(p.life<=0) fx.dust.splice(i,1);
  }
  if(fx.pop){ fx.pop.t+=dt; if(fx.pop.t>1.15) fx.pop=null; }
}
function fxDraw(){
  for(const p of fx.dust){
    g.fillStyle=p.col+(Math.max(0,p.life)*0.5).toFixed(3)+')';
    g.beginPath(); g.arc(p.x,p.y,p.r,0,7); g.fill();
  }
  if(fx.pop){
    const t=fx.pop.t; const s=t<0.12? (t/0.12)*1.18 : 1.18-Math.min(0.18,(t-0.12)*0.6);
    const a=t<0.8?1:Math.max(0,1-(t-0.8)/0.35);
    g.save(); g.globalAlpha=a; g.translate(W/2,H*0.34);
    g.font='800 '+fx.pop.size+'px "Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif';
    g.textAlign='center'; g.textBaseline='middle';
    const fit=Math.min(1,(W*0.88)/Math.max(1,g.measureText(fx.pop.txt).width));
    g.scale(s*fit,s*fit);
    g.lineWidth=12; g.strokeStyle='rgba(20,20,20,.85)'; g.strokeText(fx.pop.txt,0,0);
    g.fillStyle=fx.pop.col; g.fillText(fx.pop.txt,0,0); g.restore();
  }
  if(fx.flash>0){ g.fillStyle='rgba(255,255,255,'+Math.min(1,fx.flash)+')'; g.fillRect(0,0,W,H); }
}

/* ---------- character ---------- */
const GI='#fbfbf6', GI2='#e2e2d6', SKIN='#f0c49b', LINE='#2b2b2b', BELT='#1a1a1a';
function seg(x,y,ang,len,w,col){
  const x2=x+Math.sin(ang)*len, y2=y+Math.cos(ang)*len;
  g.lineCap='round'; g.lineWidth=w+3; g.strokeStyle=LINE;
  g.beginPath(); g.moveTo(x,y); g.lineTo(x2,y2); g.stroke();
  g.lineWidth=w; g.strokeStyle=col;
  g.beginPath(); g.moveTo(x,y); g.lineTo(x2,y2); g.stroke();
  return [x2,y2];
}
const POSES={
  stand:{aL:[0.22,0.10],aR:[-0.22,-0.10],lL:[0.12,0.05],lR:[-0.12,-0.05],lean:0},
  walk:null,
  brace:{aL:[1.5,0.7],aR:[-1.5,-0.7],lL:[0.3,0.3],lR:[-0.3,-0.3],lean:0},
  fall:{aL:[2.1,0.5],aR:[-2.1,-0.5],lL:[0.5,0.55],lR:[-0.45,-0.5],lean:0},
  tuck:{aL:[2.5,1.5],aR:[-2.5,-1.5],lL:[2.0,-1.4],lR:[-2.2,1.4],lean:0},
  ukemi:{aL:[1.42,0.06],aR:[-1.05,-0.5],lL:[0.85,0.5],lR:[-0.5,0.45],lean:0},
  down:{aL:[1.9,-0.9],aR:[-2.4,0.8],lL:[1.2,-1.0],lR:[-1.6,0.9],lean:0}
};
function drawJudoka(pose,tt){
  // 原点=腰。足元 y=+45、頭頂 y=-58
  let P=POSES[pose]||POSES.stand;
  if(pose==='walk'){
    const s=Math.sin(tt*9), c=Math.cos(tt*9);
    P={aL:[0.35*-s+0.1,0.15],aR:[0.35*s-0.1,-0.15],lL:[0.42*s,Math.max(0,-0.5*s)],lR:[-0.42*s,Math.max(0,0.5*s)],lean:0.05};
  }
  const shY=-26, hipY=0;
  // 奥側の手足
  seg(0,hipY,P.lR[0],26,11,GI2)&&0;
  let k=seg(0,hipY,P.lR[0],26,11,GI2); seg(k[0],k[1],P.lR[0]+P.lR[1],24,10,GI2);
  let a=seg(2,shY,P.aR[0],20,9,GI2); seg(a[0],a[1],P.aR[0]+P.aR[1],19,8,SKIN);
  // 胴（柔道着）
  g.save();
  g.beginPath();
  g.moveTo(-15,shY-6); g.lineTo(15,shY-6); g.lineTo(13,hipY+6); g.lineTo(-13,hipY+6); g.closePath();
  g.fillStyle=GI; g.strokeStyle=LINE; g.lineWidth=3; g.fill(); g.stroke();
  g.beginPath(); g.moveTo(-9,shY-6); g.lineTo(1,hipY+4); g.lineTo(9,shY-6);
  g.strokeStyle='#c9c9bc'; g.lineWidth=2.5; g.stroke();
  g.restore();
  // 帯
  g.fillStyle=BELT; g.fillRect(-15,hipY-6,30,8);
  g.fillRect(-4,hipY-6,7,17);
  // 手前側の手足
  k=seg(0,hipY,P.lL[0],26,11,GI); seg(k[0],k[1],P.lL[0]+P.lL[1],24,10,GI);
  a=seg(-2,shY,P.aL[0],20,9,GI); seg(a[0],a[1],P.aL[0]+P.aL[1],19,8,SKIN);
  // 頭
  const hx=Math.sin(P.lean)*8, hy=shY-18;
  g.beginPath(); g.arc(hx,hy,12.5,0,7); g.fillStyle=SKIN; g.fill();
  g.lineWidth=3; g.strokeStyle=LINE; g.stroke();
  g.beginPath(); g.arc(hx,hy-1.5,12.5,Math.PI*1.05,Math.PI*2.0); g.fillStyle='#20201f'; g.fill();
  g.fillStyle='#20201f';
  g.beginPath(); g.arc(hx+5.5,hy+2,1.8,0,7); g.fill();
  g.beginPath(); g.arc(hx-1,hy+2,1.8,0,7); g.fill();
}
function charAt(x,y,rot,pose,tt,scale){
  g.save(); g.translate(x,y); g.rotate(rot||0); if(scale&&scale!==1) g.scale(scale,scale);
  drawJudoka(pose,tt||0); g.restore();
}

/* ---------- background helpers ---------- */
function grad(y0,y1,c0,c1){ const gr=g.createLinearGradient(0,y0,0,y1); gr.addColorStop(0,c0); gr.addColorStop(1,c1); return gr; }
function drawDojo(t,gy){
  g.fillStyle='#e8dcc2'; g.fillRect(0,0,W,gy);
  g.fillStyle='#d9c9a6'; g.fillRect(0,0,W,90);
  g.strokeStyle='rgba(120,96,60,.35)'; g.lineWidth=3;
  for(let x=0;x<W;x+=120){ g.beginPath(); g.moveTo(x,90); g.lineTo(x,gy); g.stroke(); }
  g.beginPath(); g.moveTo(0,90); g.lineTo(W,90); g.stroke();
  // 掛け軸風
  g.fillStyle='#f4efe2'; g.fillRect(410,110,140,190);
  g.strokeStyle='#8b7a55'; g.lineWidth=4; g.strokeRect(410,110,140,190);
  g.fillStyle='#3a3a38'; g.font='700 52px "Hiragino Kaku Gothic ProN",serif'; g.textAlign='center';
  g.fillText('受',480,180); g.fillText('身',480,250);
  // 畳
  g.fillStyle='#5f8f5e'; g.fillRect(0,gy,W,H-gy);
  g.strokeStyle='rgba(255,255,255,.18)'; g.lineWidth=3;
  for(let x=-40;x<W+120;x+=160){ g.beginPath(); g.moveTo(x,gy); g.lineTo(x-60,H); g.stroke(); }
  for(let y=gy+28;y<H;y+=36){ g.beginPath(); g.moveTo(0,y); g.lineTo(W,y); g.stroke(); }
  g.fillStyle='rgba(0,0,0,.13)'; g.fillRect(0,gy,W,6);
}
function drawStairs(gy){
  g.fillStyle='#e7e2d6'; g.fillRect(0,0,W,H);
  g.fillStyle='#dcd5c4'; g.fillRect(0,0,W,120);
  // 階段の塊
  g.beginPath(); g.moveTo(150,170);
  for(let i=0;i<9;i++){ const x=150+i*62, y=170+i*34; g.lineTo(x+64,y); g.lineTo(x+64,y+34); }
  g.lineTo(150+9*62,gy); g.lineTo(150,gy); g.closePath();
  g.fillStyle='#c9bfa6'; g.fill();
  for(let i=0;i<9;i++){ const x=150+i*62, y=170+i*34;

/* ---------- game state ---------- */
const S={mode:'title',lv:0,t:0,input:-1,judge:null,timer:0,results:[],lastGy:430};
let last=0;

function show(node){ [el.title,el.msg,el.end].forEach(n=>n.classList.add('hide')); if(node){node.classList.remove('hide'); node.classList.remove('fadein'); void node.offsetWidth; node.classList.add('fadein');} }
function hud(on){ el.hud.style.display=on?'block':'none'; }
function hint(txt){ if(txt){ el.hint.style.display='block'; el.hint.innerHTML=txt+'<small>SPACE / TAP</small>'; } else el.hint.style.display='none'; }

function startLevel(i,withIntro){
  S.lv=i; S.t=0; S.input=-1; S.judge=null; S.timer=0;
  const L=LEVELS[i];
  L._hit=false; L._hit0=false; L._w=false; L._d=false;
  fx.dust.length=0; fx.pop=null; fx.shake=0; fx.flash=0;
  el.hudLv.textContent=L.lv; el.hudName.textContent=L.name;
  windSet(0); windStop();
  if(withIntro){
    S.mode='intro'; S.timer=0; hud(false); hint('');
    el.sub.textContent=L.lv; el.main.textContent=L.name;
    el.badge.textContent=''; el.badge.className='';
    el.tip.textContent=L.desc; el.go.textContent='タップ / SPACE ですすむ';
    el.msg.classList.remove('clear-bg');
    show(el.msg);
  } else beginAction();
}
function beginAction(){
  S.mode='action'; S.t=0; S.input=-1; S.judge=null;
  hud(true); hint(HINT); show(null);
}
function judgeOf(d,w){
  if(d>=w.p[0]&&d<=w.p[1]) return 'perfect';
  if(d>=w.g[0]&&d<=w.g[1]) return 'good';
  return d<0?'early':'late';
}
function onInput(){
  const c=ac();
  if(S.mode==='title'){ return; }
  if(S.mode==='intro'){ if(S.timer>0.35) beginAction(); return; }
  if(S.mode==='action'){
    if(S.t<0.3) return;
    if(S.input>=0) return;
    S.input=S.t;
    const L=LEVELS[S.lv], d=S.t-L.land;
    S.judge=judgeOf(d,L.win);
    if(S.judge==='early'&&d<-0.85){ // 明らかに早い → 即やり直し
      S.mode='post'; S.timer=0; S.postDur=0.45; S.fail=true; sfxFail(); hint('');
    }
    return;
  }
  if(S.mode==='result'){ if(S.timer>0.5) nextLevel(); return; }
  if(S.mode==='fail'){ if(S.timer>0.4) startLevel(S.lv,false); return; }
}
function nextLevel(){
  if(S.lv+1<LEVELS.length) startLevel(S.lv+1,true);
  else{
    S.mode='end'; hud(false); hint(''); windSet(0); windStop();
    const p=S.results.filter(r=>r==='perfect').length;
    el.rank.textContent='PERFECT '+p+' / '+S.results.length;
    show(el.end); bgmStop(); bgmLoop();
  }
}
function landNow(){
  const L=LEVELS[S.lv];
  S.mode='post'; S.timer=0; S.postDur=L.impact.dur;
  windSet(0.02); hint('');
  if(S.judge==='perfect'||S.judge==='good'){
    S.fail=false;
    slap(L.impact.power);
    shake(L.impact.shake);
    dust(L.chx||480,L.gy,L.impact.dust,L.impact.power,null,L.impact.power>=3?2.1:1);
    popText(L.impact.word,L.impact.size,'#ffffff');
    if(L.impact.power>=3) flash(0.5);
    sfxOk(S.judge==='perfect');
  }else{
    S.fail=true;
    slap(Math.max(1,L.impact.power*0.5));
    shake(L.impact.shake*0.5); dust(L.chx||480,L.gy,Math.round(L.impact.dust*0.5),L.impact.power*0.6);
    sfxFail();
    S.postDur=Math.min(1.4,L.impact.dur*0.6);
  }
}
function finishPost(){
  const L=LEVELS[S.lv];
  if(!S.fail){
    S.results.push(S.judge);
    S.mode='result'; S.timer=0; hint('');
    el.sub.textContent=''; el.main.textContent='見事な受身です！';
    el.badge.textContent=S.judge==='perfect'?'PERFECT':'GOOD';
    el.badge.className=S.judge==='perfect'?'badge-p':'badge-g';
    el.tip.textContent='';
    el.go.textContent=(S.lv+1<LEVELS.length)?'タップ / SPACE でつぎへ':'タップ / SPACE でつぎへ';
    el.msg.classList.add('clear-bg'); show(el.msg); hud(true);
  }else{
    S.mode='fail'; S.timer=0; hint('');
    el.sub.textContent=L.lv+'　'+L.name; el.badge.textContent=''; el.badge.className='';
    el.main.textContent = (S.judge==='early')?'受身が少し早かったようです':'受身が遅かったようです';
    el.tip.textContent='もう一度やってみましょう。';
    el.go.textContent='タップ / SPACE でもう一度';
    el.msg.classList.remove('clear-bg'); show(el.msg); hud(false);
  }
}

/* ---------- loop ---------- */
function frame(ts){
  requestAnimationFrame(frame);
  const dt=Math.min(0.05,(ts-last)/1000||0); last=ts;
  update(dt); render();
}
function update(dt){
  fxUpdate(dt);
  S.timer+=dt;
  if(S.mode==='action'){
    S.t+=dt;
    const L=LEVELS[S.lv];
    if(S.t>=L.land){
      if(S.input<0){ S.judge='late'; }
      landNow();
    }
  }else if(S.mode==='post'){
    if(S.timer>=S.postDur) finishPost();
  }
}
function drawScene(){
  S.charTop=null;
  const L=LEVELS[S.lv];
  let t = (S.mode==='action')?S.t:L.land;
  L.draw(t);
  let c=L.ch(t);
  L.chx=c.x;
  if(S.mode==='action'){
    charAt(c.x,c.y,c.rot,c.pose,c.tt||S.t,c.sc||1);
  }else if(S.mode==='post'){
    const p=S.timer, gy=L.gy;
    const hide=L.impact.hide||0;
    if(S.fail){
      if(p>hide) S.charTop={x:c.x,y:gy-22,rot:-Math.PI/2,pose:'down'};
    }else{
      if(p>=hide){
        const rise=Math.max(0,Math.min(1,(p-hide-0.35)/0.5));
        const rot=-Math.PI/2*(1-ez(rise,1.2));
        const y=lerp(gy-24,gy-45,ez(rise,1.2));
        S.charTop={x:c.x,y:y,rot:rot,pose:rise>0.7?'stand':'ukemi'};
      }
    }
  }else{
    charAt(c.x,L.gy-45,0,'stand',0);
  }
}
function render(){
  g.setTransform(1,0,0,1,0,0);
  const dpr=cv.width/W; g.setTransform(dpr,0,0,dpr,0,0);
  g.clearRect(0,0,W,H);
  g.save();
  if(fx.shake>0){ g.translate((Math.random()-0.5)*fx.shake,(Math.random()-0.5)*fx.shake); }
  if(S.mode==='title'){ drawDojo(0,430); charAt(480,430-45,0,'stand',0); }
  else if(S.mode==='end'){ drawDojo(0,430); charAt(480,430-45,0,'stand',0); }
  else drawScene();
  fxDraw();
  if(S.charTop){ const c=S.charTop; charAt(c.x,c.y,c.rot,c.pose,0); }
  g.restore();
}

/* ---------- input ---------- */
document.addEventListener('keydown',(e)=>{
  if(e.code==='Space'||e.key===' '||e.code==='Enter'){ e.preventDefault();
    if(S.mode==='title'){ begin(); return; }
    if(S.mode==='end'){ restart(); return; }
    onInput(); }
},{passive:false});
wrap.addEventListener('pointerdown',(e)=>{
  if(e.target.tagName==='BUTTON'||e.target.id==='mute') return;
  ac(); onInput();
});
document.getElementById('btn-start').addEventListener('click',(e)=>{e.stopPropagation();begin();});
document.getElementById('btn-again').addEventListener('click',(e)=>{e.stopPropagation();restart();});
function begin(){ ac(); bgmStop(); S.results=[]; startLevel(0,true); }
function restart(){ bgmStop(); windStop(); S.results=[]; startLevel(0,true); }

window.__ukemi={S:S,LEVELS:LEVELS,input:onInput};
resize(); show(el.title); hud(false); hint('');
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
