<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#11182a">
<title>ここにトイレはありません</title>
<meta name="description" content="駅の管理人になって「ここにトイレはありません」ポスターを貼る、俯瞰2Dの短編誘導ゲーム。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage"><div id="wrap">
  <canvas id="cv"></canvas>

  <!-- 上部：段階表示と音量 -->
  <div id="topbar" class="hide">
    <div id="phase">プロローグ</div>
    <button id="mute" aria-label="ミュート切り替え">♪</button>
    <input id="vol" type="range" min="0" max="100" value="70" aria-label="音量">
  </div>

  <!-- 管理人のセリフ（心の声） -->
  <div id="msg" class="hide"><span id="msg-who"></span><span id="msg-text"></span></div>

  <div id="toast" class="hide"></div>
  <div id="hint" class="hide"></div>

  <!-- 下部ツールバー -->
  <div id="toolbar" class="hide">
    <div id="tools">
      <button class="tool locked" data-tool="place" aria-label="貼る">
        <svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="1" fill="#fbfaf3" stroke="#9a9484"/><rect x="7.5" y="5.5" width="9" height="9" rx="1.5" fill="#1d5fc0"/><rect x="8" y="16.5" width="8" height="1.2" fill="#888"/></svg>
        <span>貼る</span></button>
      <button class="tool locked" data-tool="move" aria-label="移動">
        <svg viewBox="0 0 24 24"><path d="M12 2l3 3.5h-2v5h5v-2l3.5 3.5-3.5 3.5v-2h-5v5h2L12 22l-3-3.5h2v-5h-5v2L2.5 12 6 8.5v2h5v-5H9z" fill="#ffd24a"/></svg>
        <span>移動</span></button>
      <button class="tool locked" data-tool="remove" aria-label="はがす">
        <svg viewBox="0 0 24 24"><path d="M5 3h14v12l-6 6H5z" fill="#fbfaf3" stroke="#9a9484"/><path d="M13 21v-6h6z" fill="#cfc8b4"/><path d="M8 8l6 6M14 8l-6 6" stroke="#7a8496" stroke-width="1.6"/></svg>
        <span>はがす</span></button>
      <button class="tool locked" data-tool="scale" aria-label="巨大化">
        <svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="6.5" fill="none" stroke="#9fd0ff" stroke-width="2.4"/><path d="M15 15l6 6" stroke="#9fd0ff" stroke-width="3" stroke-linecap="round"/><path d="M10 6.5v7M6.5 10h7" stroke="#fff" stroke-width="2"/></svg>
        <span>巨大化</span></button>
      <button class="tool locked" data-tool="tape" aria-label="赤テープ">
        <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2" fill="#1d5fc0"/><path d="M5 5l14 14M19 5L5 19" stroke="#e0322c" stroke-width="3.6"/></svg>
        <span>赤テープ</span></button>
    </div>
    <div id="pcount">ポスター<br><b id="pc-n">0</b>/<span id="pc-max">0</span></div>
    <div id="stats">
      <div class="chip ok"><i></i>到着<b id="st-arr">0</b></div>
      <div class="chip ng"><i></i>誤誘導<b id="st-fool">0</b></div>
      <div class="chip ask"><i></i>問い合わせ<b id="st-ask">0</b></div>
      <div class="meter"><span>混雑</span><i><em id="m-crowd"></em></i></div>
      <div class="meter"><span>切迫</span><i><em id="m-urg"></em></i></div>
    </div>
  </div>

  <!-- ポスター完成カード -->
  <div id="card" class="hide">
    <div class="card-in">
      <div class="card-lead">ポスターをつくった！</div>
      <svg class="poster-svg" viewBox="0 0 100 124" aria-label="ここにトイレはありません のポスター">
        <rect x="2" y="2" width="96" height="120" rx="2" fill="#fbfaf3" stroke="#b5b0a0" stroke-width="1.2"/>
        <rect x="10" y="10" width="80" height="80" rx="9" fill="#1d5fc0"/>
        <g fill="#fff">
          <circle cx="32" cy="26" r="6"/><rect x="24" y="34" width="16" height="24" rx="3"/><rect x="25" y="56" width="6" height="24"/><rect x="33" y="56" width="6" height="24"/>
          <circle cx="68" cy="26" r="6"/><path d="M61 34h14l6 28H55z"/><rect x="62" y="60" width="4" height="20"/><rect x="70" y="60" width="4" height="20"/>
        </g>
        <rect x="49.3" y="18" width="1.4" height="64" fill="#fff" opacity=".55"/>
        <text x="50" y="104" font-size="7.2" text-anchor="middle" fill="#333" font-family="'Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,sans-serif">ここにトイレはありません</text>
      </svg>
      <div class="card-note">これで、もう聞かれないはず。</div>
      <div class="card-tap">タップで閉じる</div>
    </div>
  </div>

  <!-- タイトル -->
  <div id="title" class="screen">
    <div class="t-inner">
      <svg class="t-poster" viewBox="0 0 100 124" aria-hidden="true">
        <rect x="2" y="2" width="96" height="120" rx="2" fill="#fbfaf3" stroke="#b5b0a0" stroke-width="1.2"/>
        <rect x="10" y="10" width="80" height="80" rx="9" fill="#1d5fc0"/>
        <g fill="#fff">
          <circle cx="32" cy="26" r="6"/><rect x="24" y="34" width="16" height="24" rx="3"/><rect x="25" y="56" width="6" height="24"/><rect x="33" y="56" width="6" height="24"/>
          <circle cx="68" cy="26" r="6"/><path d="M61 34h14l6 28H55z"/><rect x="62" y="60" width="4" height="20"/><rect x="70" y="60" width="4" height="20"/>
        </g>
        <rect x="49.3" y="18" width="1.4" height="64" fill="#fff" opacity=".55"/>
        <text x="50" y="104" font-size="7.2" text-anchor="middle" fill="#333" font-family="'Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,sans-serif">ここにトイレはありません</text>
      </svg>
      <div class="t-text">
        <div class="t-sub">そよかぜ駅・管理人の一日</div>
        <h1>ここにトイレは<br>ありません</h1>
        <p>この通路にトイレはない。<br>それなのに、今日もトイレを探す人がやってくる。</p>
        <button class="btn" id="btn-start">はじめる</button>
        <div class="t-note">マウス / タッチで操作 ・ 約4分 ・ 音が出ます（左上で調整）</div>
      </div>
    </div>
  </div>

  <!-- エンディング -->
  <div id="ending" class="screen hide">
    <div class="e-title">『ここにトイレはありません』</div>
    <div class="e-stats" id="e-stats"></div>
    <div class="e-btns">
      <button class="btn" id="btn-again">もう一度</button>
      <button class="btn sub" id="btn-title">タイトルへ</button>
    </div>
  </div>

  <div id="rotate-note" class="hide">横向きにすると大きく遊べます</div>
</div></div>
<script src="game.js"></script>
</body>
</html>
