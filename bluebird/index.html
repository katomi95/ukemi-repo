<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="幸福の青い鳥を探して世界の果てまで旅をした二人の、旅の終わりの短編ゲーム。">
<title>青い鳥（物理）</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{width:100%;height:100%;background:#0a0d12;overflow:hidden;
    font-family:"Hiragino Mincho ProN","HiraMinProN-W3","Yu Mincho","YuMincho","MS PMincho",serif;
    color:#3d3227;-webkit-user-select:none;user-select:none;}
  #stage{position:fixed;inset:0;overflow:hidden;}
  #wrap{position:absolute;left:50%;top:50%;width:960px;height:540px;
        transform:translate(-50%,-50%);transform-origin:50% 50%;
        background:#cfe6f2;overflow:hidden;box-shadow:0 0 3em rgba(0,0,0,.6);font-size:16px;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}
  #ui{position:absolute;inset:0;pointer-events:none;}

  /* ---- 会話ウィンドウ ---- */
  #box{position:absolute;left:5.5%;right:5.5%;bottom:5%;padding:1.05em 1.6em 1.35em;
       background:rgba(253,249,240,.94);border:1px solid rgba(150,128,98,.5);border-radius:.45em;
       box-shadow:0 .5em 1.8em rgba(50,38,24,.25);min-height:7.2em;}
  #who{font-size:.95em;letter-spacing:.2em;color:#96795a;margin-bottom:.5em;min-height:1.2em;}
  #line{font-size:1.45em;line-height:1.9;color:#3d3227;white-space:pre-wrap;min-height:2.9em;letter-spacing:.04em;}
  #line.nar{color:#5b4d3c;}
  #cursor{position:absolute;right:1.1em;bottom:.45em;font-size:.85em;color:#a48c68;opacity:0;
          animation:bob 1.1s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(.22em)}}

  /* ---- 選択肢 ---- */
  #choices{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
           width:27em;display:flex;flex-direction:column;gap:.9em;pointer-events:auto;}
  #choices .q{text-align:center;font-size:1.1em;letter-spacing:.24em;color:#fdf6e6;
              text-shadow:0 .12em .5em rgba(0,0,0,.7);margin-bottom:.4em;}
  .ch{font-family:inherit;font-size:1.28em;padding:.9em 1.2em;letter-spacing:.1em;text-align:center;
      background:rgba(253,249,240,.95);border:1px solid rgba(150,128,98,.55);border-radius:.35em;
      color:#3d3227;cursor:pointer;box-shadow:0 .35em 1em rgba(50,38,24,.22);
      transition:transform .12s ease,background .18s ease;}
  .ch:hover{background:#fffdf7;transform:translateY(-.12em);}
  .ch:active{transform:translateY(0);}
  .ch.sm{font-size:1.1em;padding:.75em 1em;}
  #choices.yn{width:22em;}

  #scrim{position:absolute;inset:0;transition:opacity .5s ease;
         background:radial-gradient(ellipse 62% 58% at 50% 50%,rgba(10,14,22,.46) 0%,rgba(10,14,22,.26) 55%,rgba(10,14,22,0) 82%);}
  #scrim.soft{background:radial-gradient(ellipse 70% 46% at 50% 50%,rgba(12,18,28,.3) 0%,rgba(12,18,28,.14) 58%,rgba(12,18,28,0) 84%);}

  /* ---- 中央カード ---- */
  #center{position:absolute;inset:0;display:flex;flex-direction:column;
          align-items:center;justify-content:center;text-align:center;padding:2.5em;gap:.9em;}
  #center .big{font-size:2.35em;line-height:1.9;letter-spacing:.18em;color:#fffdf6;
               text-shadow:0 .1em .55em rgba(0,0,0,.62),0 0 1.6em rgba(0,0,0,.35);}
  #center .sub{font-size:1.15em;letter-spacing:.22em;color:#f4ecdc;opacity:.85;
               text-shadow:0 .1em .5em rgba(0,0,0,.6);}

  /* ---- ヒント ---- */
  #hint{position:absolute;left:0;right:0;bottom:2.2em;text-align:center;font-size:1.05em;
        letter-spacing:.2em;color:#fffaf0;text-shadow:0 .12em .5em rgba(0,0,0,.75);opacity:.9;}
  #hint small{display:block;margin-top:.5em;font-size:.72em;opacity:.72;letter-spacing:.14em;}
  #hint.up{bottom:7.4em;}

  /* ---- 回想の光 ---- */
  #motes{position:absolute;inset:0;}
  .mote{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;cursor:pointer;
        background:none;border:none;font-family:inherit;color:#fdf6e6;padding:.6em;
        display:flex;flex-direction:column;align-items:center;gap:.55em;}
  .mote .dot{width:1.55em;height:1.55em;border-radius:50%;
             background:radial-gradient(circle,#fff 0%,#ffe9b4 42%,rgba(255,220,150,0) 72%);
             box-shadow:0 0 1.7em .45em rgba(255,226,160,.5);}
  .mote .nm{font-size:1.02em;letter-spacing:.16em;text-shadow:0 .12em .5em rgba(0,0,0,.75);white-space:nowrap;}
  .mote:hover .dot{box-shadow:0 0 2.4em .8em rgba(255,235,185,.75);}
  .mote:hover .nm{color:#fff;}
  .mote.done{opacity:.34;cursor:default;}
  .mote.done .dot{background:radial-gradient(circle,#c9d4de 0%,rgba(190,205,220,0) 68%);box-shadow:none;}
  #counter{position:absolute;left:0;right:0;top:2em;text-align:center;font-size:1em;
           letter-spacing:.28em;color:#f3ead8;text-shadow:0 .12em .5em rgba(0,0,0,.7);opacity:.9;}

  /* ---- 調べる道具 ---- */
  #tools{position:absolute;left:0;right:0;bottom:2.4em;display:flex;justify-content:center;gap:1em;pointer-events:auto;}
  .tool{font-family:inherit;font-size:1.05em;letter-spacing:.14em;padding:.6em 1.5em;cursor:pointer;
        background:rgba(253,249,240,.86);border:1px solid rgba(150,128,98,.5);border-radius:2em;color:#4a3c2c;}
  .tool.on{background:#fff6de;box-shadow:0 0 1.2em .2em rgba(255,224,150,.55);color:#2f2517;}
  #found{position:absolute;left:2.2em;top:4.6em;font-size:1.02em;line-height:2.15;letter-spacing:.1em;
         color:#f4ecdc;text-shadow:0 .12em .5em rgba(0,0,0,.8);}
  #found div{opacity:0;transition:opacity .7s ease;}
  #found div.on{opacity:.95;}

  /* ---- 画面 ---- */
  .screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
          justify-content:center;text-align:center;padding:2.5em;pointer-events:auto;}
  .hide{display:none !important;}

  #s-title{background:linear-gradient(180deg,rgba(190,226,242,.2) 0%,rgba(248,240,220,.35) 100%);}
  #s-title h1{font-size:5.4em;letter-spacing:.34em;text-indent:.34em;color:#26456e;
              text-shadow:0 .06em .3em rgba(255,255,255,.85);}
  #s-title .paren{margin-top:.2em;font-size:1.25em;letter-spacing:.5em;text-indent:.5em;color:#3d5f8c;opacity:.75;}
  #s-title .sub{margin-top:1.7em;font-size:1.05em;letter-spacing:.34em;text-indent:.34em;color:#4a4033;opacity:.8;}
  #s-title .note{margin-top:2.1em;font-size:.9em;line-height:2;color:#4a4033;opacity:.66;letter-spacing:.1em;}
  .btn{pointer-events:auto;cursor:pointer;font-family:inherit;font-size:1.35em;letter-spacing:.26em;
       text-indent:.26em;padding:.75em 2.6em;border:1px solid rgba(38,69,110,.35);border-radius:.35em;
       background:rgba(253,249,240,.95);color:#26456e;box-shadow:0 .35em 1em rgba(40,60,90,.22);
       transition:transform .12s ease,background .18s ease;}
  .btn:hover{background:#fff;transform:translateY(-.12em);}
  #s-title .btn{margin-top:2.2em;}

  #s-end{background:rgba(8,11,16,.34);}
  #s-end .cap{font-size:1em;letter-spacing:.36em;text-indent:.36em;color:#efe6d4;opacity:.7;margin-bottom:1em;
              text-shadow:0 .1em .5em rgba(0,0,0,.7);}
  #s-end h2{font-size:2.3em;font-weight:400;letter-spacing:.16em;color:#fffdf6;line-height:1.8;
            text-shadow:0 .1em .6em rgba(0,0,0,.7);}
  #s-end .list{margin:2em 0 1.9em;font-size:1em;line-height:2.3;letter-spacing:.14em;color:#f0e7d6;
               text-shadow:0 .1em .5em rgba(0,0,0,.7);}
  #s-end .list .off{opacity:.34;}
  #s-end .row{display:flex;gap:1em;flex-wrap:wrap;justify-content:center;}
  #s-end .btn{font-size:1.1em;padding:.7em 1.8em;}

  #mute{position:absolute;top:1em;right:1.1em;pointer-events:auto;cursor:pointer;font-size:.85em;
        letter-spacing:.14em;padding:.45em .95em;border:1px solid rgba(255,255,255,.45);border-radius:2em;
        background:rgba(20,30,45,.28);color:#fffdf6;text-shadow:0 .1em .4em rgba(0,0,0,.5);}
  #skip{position:absolute;top:1em;left:1.1em;pointer-events:auto;cursor:pointer;font-size:.8em;
        letter-spacing:.14em;padding:.45em .95em;border:1px solid rgba(255,255,255,.32);border-radius:2em;
        background:rgba(20,30,45,.24);color:#fffdf6;opacity:.55;text-shadow:0 .1em .4em rgba(0,0,0,.5);}
  #skip:hover{opacity:.95;}
  #mute,#skip{transition:opacity .8s ease;}
  #ui.dark #mute,#ui.dark #skip{opacity:.06;}
</style>
</head>
<body>
<div id="stage"><div id="wrap">
  <canvas id="cv"></canvas>
  <div id="ui">
    <div id="motes" class="hide"></div>
    <div id="counter" class="hide"></div>
    <div id="found" class="hide"></div>
    <div id="tools" class="hide"></div>
    <div id="scrim" class="hide"></div>
    <div id="center" class="hide"></div>
    <div id="hint"></div>
    <div id="box" class="hide"><div id="who"></div><div id="line"></div><div id="cursor">▼</div></div>
    <div id="choices" class="hide"></div>

    <div id="s-title" class="screen">
      <h1>青い鳥</h1>
      <div class="paren">（物理）</div>
      <div class="sub">―― 旅の終わりに ――</div>
      <button class="btn" id="start">はじめる</button>
      <div class="note">クリック / タップ / Space で読み進めます<br>音が出ます。できれば音のある環境で</div>
    </div>

    <div id="s-end" class="screen hide">
      <div class="cap">ENDING</div>
      <h2 id="end-title"></h2>
      <div class="list" id="end-list"></div>
      <div class="row">
        <button class="btn" id="again">選択の場面から</button>
        <button class="btn" id="restart">最初から</button>
      </div>
    </div>

    <div id="mute">♪ ON</div>
    <div id="skip">文字：ふつう</div>
  </div>
</div></div>
<script>
"use strict";
const W=960,H=540;
const wrap=document.getElementById('wrap');
const cv=document.getElementById('cv');
const g=cv.getContext('2d');
const el={};
['motes','counter','found','tools','center','hint','box','who','line','cursor','choices','scrim',
 's-title','s-end','end-title','end-list','start','again','restart','mute','skip']
 .forEach(id=>el[id.replace('s-','s')]=document.getElementById(id));

/* =========================================================
   画面サイズ / 座標変換
   ========================================================= */
const VIEW={rot:false,w:W,h:H};
function resize(){
  const vw=window.innerWidth, vh=window.innerHeight;
  const portrait=vh>vw*1.08;
  const aw=portrait?vh:vw, ah=portrait?vw:vh;
  const w=Math.min(aw,ah*W/H), h=w*H/W;
  VIEW.rot=portrait; VIEW.w=w; VIEW.h=h;
  wrap.style.width=w+'px'; wrap.style.height=h+'px';
  wrap.style.transform='translate(-50%,-50%)'+(portrait?' rotate(90deg)':'');
  wrap.style.fontSize=(w/W*16)+'px';
  const dpr=Math.min(window.devicePixelRatio||1,2);
  const cw=Math.round(W*dpr), chh=Math.round(H*dpr);
  if(cv.width!==cw||cv.height!==chh){ cv.width=cw; cv.height=chh; }
  g.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',()=>setTimeout(resize,140));

/* 画面上の点 → キャンバス座標（縦持ちの 90 度回転にも対応） */
function toCanvas(clientX,clientY){
  const cx=window.innerWidth/2, cy=window.innerHeight/2;
  let dx=clientX-cx, dy=clientY-cy;
  if(VIEW.rot){ const t=dx; dx=dy; dy=-t; }
  return {x:(dx/VIEW.w+0.5)*W, y:(dy/VIEW.h+0.5)*H};
}

/* =========================================================
   音
   ========================================================= */
const A={ctx:null,on:true,master:null,mus:null,sfx:null,rev:null,ready:false,
         bgmOn:false,bgmBar:0,bgmNext:0,bgmTimer:null,windSrc:null,windGain:null};
function ac(){
  if(!A.ctx){ try{ A.ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } }
  if(A.ctx.state==='suspended') A.ctx.resume();
  if(!A.ready) buildBus();
  return A.ctx;
}
function noiseBuf(sec){
  const c=A.ctx, n=Math.max(1,Math.floor(c.sampleRate*sec));
  const b=c.createBuffer(1,n,c.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=Math.random()*2-1;
  return b;
}
function impulse(sec,decay){
  const c=A.ctx, n=Math.floor(c.sampleRate*sec), b=c.createBuffer(2,n,c.sampleRate);
  for(let ch=0;ch<2;ch++){
    const d=b.getChannelData(ch);
    for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,decay);
  }
  return b;
}
function buildBus(){
  const c=A.ctx;
  A.master=c.createGain(); A.master.gain.value=A.on?1:0; A.master.connect(c.destination);
  A.mus=c.createGain(); A.mus.gain.value=0.9; A.mus.connect(A.master);
  A.sfx=c.createGain(); A.sfx.gain.value=1;   A.sfx.connect(A.master);
  const conv=c.createConvolver(); conv.buffer=impulse(2.8,2.4);
  const rg=c.createGain(); rg.gain.value=0.62; conv.connect(rg); rg.connect(A.master);
  A.rev=conv; A.ready=true;
}
function out(node,bus,send){
  node.connect(bus);
  if(send){ const s=A.ctx.createGain(); s.gain.value=send; node.connect(s); s.connect(A.rev); }
}

/* --- オルゴールの音 --- */
function mbox(freq,t,dur,vol){
  const c=A.ctx;
  const gg=c.createGain();
  gg.gain.setValueAtTime(0.0001,t);
  gg.gain.exponentialRampToValueAtTime(vol,t+0.006);
  gg.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  const o=c.createOscillator(); o.type='sine'; o.frequency.value=freq; o.connect(gg);
  const o2=c.createOscillator(); o2.type='sine'; o2.frequency.value=freq*2.008;
  const g2=c.createGain(); g2.gain.value=0.3; o2.connect(g2); g2.connect(gg);
  const o3=c.createOscillator(); o3.type='sine'; o3.frequency.value=freq*3.02;
  const g3=c.createGain(); g3.gain.value=0.1; o3.connect(g3); g3.connect(gg);
  out(gg,A.mus,0.6);
  [o,o2,o3].forEach(x=>{ x.start(t); x.stop(t+dur+0.08); });
}
function pad(freqs,t,dur,vol){
  const c=A.ctx;
  const lp=c.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=900;
  const gg=c.createGain();
  gg.gain.setValueAtTime(0.0001,t);
  gg.gain.linearRampToValueAtTime(vol,t+0.5);
  gg.gain.linearRampToValueAtTime(0.0001,t+dur);
  lp.connect(gg); out(gg,A.mus,0.5);
  freqs.forEach((f,i)=>{
    const o=c.createOscillator(); o.type='triangle'; o.frequency.value=f*(i?1.001:0.999);
    const og=c.createGain(); og.gain.value=0.34;
    o.connect(og); og.connect(lp); o.start(t); o.stop(t+dur+0.1);
  });
}
/* C - Am - F - G */
const BAR=2.55, BEAT=BAR/4;
const CHORD=[[130.81,164.81,196.00],[110.00,130.81,164.81],[87.31,130.81,174.61],[98.00,123.47,146.83]];
const MEL=[[659.25,783.99,880.00,1046.50],
           [880.00,783.99,659.25,587.33],
           [698.46,880.00,1046.50,880.00],
           [783.99,987.77,1174.66,987.77]];
function scheduleBar(i,t){
  pad(CHORD[i],t,BAR*1.05,0.045);
  const bass=CHORD[i][0]/2;
  mbox(bass,t,BAR*0.9,0.05);
  MEL[i].forEach((f,k)=>{
    if(k===2 && i%2===1) return;                  // すこし隙間をつくる
    mbox(f,t+k*BEAT,1.6-k*0.12,0.085);
    if(k===0) mbox(f*2,t+k*BEAT+0.02,1.1,0.018);  // かすかな倍音のきらめき
  });
}
function bgmTick(){
  const c=A.ctx; if(!c||!A.bgmOn) return;
  while(A.bgmNext < c.currentTime+1.4){
    scheduleBar(A.bgmBar%4, A.bgmNext);
    A.bgmNext+=BAR; A.bgmBar++;
  }
  A.bgmTimer=setTimeout(bgmTick,320);
}
function bgmStart(){
  const c=ac(); if(!c||A.bgmOn) return;
  A.bgmOn=true; A.bgmNext=c.currentTime+0.25; bgmTick();
}
function bgmStop(){ A.bgmOn=false; if(A.bgmTimer){clearTimeout(A.bgmTimer);A.bgmTimer=null;} }
/* 曲そのものは変えず、音量だけそっと沈める */
function musLevel(v,sec){
  if(A.mus&&A.ctx) A.mus.gain.setTargetAtTime(v,A.ctx.currentTime,(sec||0.6)/3);
}

/* --- 効果音 --- */
function heart(vol){                                   // ドクン
  const c=ac(); if(!c) return; const t0=c.currentTime; vol=vol||1;
  [[0,1],[0.175,0.62]].forEach(([d,m])=>{
    const t=t0+d;
    const o=c.createOscillator(); o.type='sine';
    o.frequency.setValueAtTime(d?66:82,t);
    o.frequency.exponentialRampToValueAtTime(d?31:37,t+0.17);
    const lp=c.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=230;
    const gg=c.createGain();
    gg.gain.setValueAtTime(0.0001,t);
    gg.gain.exponentialRampToValueAtTime(0.5*m*vol,t+0.015);
    gg.gain.exponentialRampToValueAtTime(0.0001,t+0.3);
    o.connect(lp); lp.connect(gg); out(gg,A.sfx,0.1);
    o.start(t); o.stop(t+0.45);
  });
}
function flutter(n,muffled,vol){                       // ばさ
  const c=ac(); if(!c) return; const t0=c.currentTime;
  vol=(vol===undefined?1:vol); n=n||1;
  for(let k=0;k<n;k++){
    const t=t0+k*(0.125+Math.random()*0.045);
    const src=c.createBufferSource(); src.buffer=noiseBuf(0.35);
    const bp=c.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=0.85;
    bp.frequency.setValueAtTime(muffled?560:1650,t);
    bp.frequency.exponentialRampToValueAtTime(muffled?200:540,t+0.1);
    const lp=c.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=muffled?760:4600;
    const gg=c.createGain();
    gg.gain.setValueAtTime(0.0001,t);
    gg.gain.exponentialRampToValueAtTime(vol*(muffled?0.55:0.34),t+0.014);
    gg.gain.exponentialRampToValueAtTime(0.0001,t+0.115);
    src.connect(bp); bp.connect(lp); lp.connect(gg); out(gg,A.sfx,muffled?0.15:0.45);
    src.start(t); src.stop(t+0.36);
    if(muffled){                                       // 体の内側で鳴っている感じ
      const o=c.createOscillator(); o.type='sine';
      o.frequency.setValueAtTime(128,t); o.frequency.exponentialRampToValueAtTime(62,t+0.1);
      const og=c.createGain();
      og.gain.setValueAtTime(0.0001,t);
      og.gain.exponentialRampToValueAtTime(0.14*vol,t+0.012);
      og.gain.exponentialRampToValueAtTime(0.0001,t+0.15);
      o.connect(og); out(og,A.sfx,0.1); o.start(t); o.stop(t+0.25);
    }
  }
}
function chime(f,vol){
  const c=ac(); if(!c) return; const t=c.currentTime;
  mboxSfx(f||1046.5,t,1.1,vol||0.09);
}
function mboxSfx(freq,t,dur,vol){
  const c=A.ctx;
  const gg=c.createGain();
  gg.gain.setValueAtTime(0.0001,t);
  gg.gain.exponentialRampToValueAtTime(vol,t+0.006);
  gg.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  const o=c.createOscillator(); o.type='sine'; o.frequency.value=freq; o.connect(gg);
  const o2=c.createOscillator(); o2.type='sine'; o2.frequency.value=freq*2.01;
  const g2=c.createGain(); g2.gain.value=0.25; o2.connect(g2); g2.connect(gg);
  out(gg,A.sfx,0.6);
  [o,o2].forEach(x=>{x.start(t);x.stop(t+dur+0.05);});
}
function cutSfx(){                                     // 何かを切る音（布のように鈍く、短く）
  const c=ac(); if(!c) return; const t=c.currentTime;
  const src=c.createBufferSource(); src.buffer=noiseBuf(1.2);
  const lp=c.createBiquadFilter(); lp.type='lowpass';
  lp.frequency.setValueAtTime(760,t); lp.frequency.linearRampToValueAtTime(280,t+0.5);
  const gg=c.createGain();
  gg.gain.setValueAtTime(0.0001,t);
  gg.gain.linearRampToValueAtTime(0.2,t+0.34);
  gg.gain.linearRampToValueAtTime(0.0001,t+0.48);
  src.connect(lp); lp.connect(gg); out(gg,A.sfx,0.3);
  src.start(t); src.stop(t+1.0);
  const s2=c.createBufferSource(); s2.buffer=noiseBuf(0.3);
  const bp=c.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=880; bp.Q.value=1.2;
  const g2=c.createGain();
  g2.gain.setValueAtTime(0.0001,t+0.3);
  g2.gain.exponentialRampToValueAtTime(0.16,t+0.315);
  g2.gain.exponentialRampToValueAtTime(0.0001,t+0.42);
  s2.connect(bp); bp.connect(g2); out(g2,A.sfx,0.35);
  s2.start(t+0.3); s2.stop(t+0.7);
}
function windStart(){
  const c=ac(); if(!c||A.windSrc) return;
  const s=c.createBufferSource(); s.buffer=noiseBuf(3); s.loop=true;
  const f=c.createBiquadFilter(); f.type='lowpass'; f.frequency.value=560;
  const gg=c.createGain(); gg.gain.value=0.0001;
  s.connect(f); f.connect(gg); gg.connect(A.sfx);
  s.start(); A.windSrc=s; A.windGain=gg;
}

    el.line.className=who?'':'nar';
    el.line.textContent='';

function advance(){
  if(TX.res){
    if(!TX.done){ TX.shown=TX.full.length; el.line.textContent=TX.full; TX.done=true; el.cursor.style.opacity=1; }
    else { const r=TX.res; TX.res=null; el.cursor.style.opacity=0; r(); }
    return;
  }
  if(WAITCLICK){ const r=WAITCLICK; WAITCLICK=null; r(); }
}
function tickText(dt){
  if(!TX.res||TX.done) return;
  TX.acc+=dt;
  while(TX.acc>=TX.speed && TX.shown<TX.full.length){ TX.acc-=TX.speed; TX.shown++; }
  el.line.textContent=TX.full.slice(0,TX.shown);
  if(TX.shown>=TX.full.length){ TX.done=true; el.cursor.style.opacity=1; }
}

/* --- 紙の質感 --- */
const grain=(function(){
  const c=document.createElement('canvas'); c.width=c.height=140;
  const x=c.getContext('2d'), d=x.createImageData(140,140);
  for(let i=0;i<140*140;i++){
    const v=Math.random();
    d.data[i*4]=d.data[i*4+1]=d.data[i*4+2]=v<0.5?40:255;
    d.data[i*4+3]=Math.random()*26;
  }
  x.putImageData(d,0,0); return c;
})();
let grainPat=null;
function paper(){
  if(!grainPat) grainPat=g.createPattern(grain,'repeat');
  g.save(); g.globalAlpha=0.5; g.fillStyle=grainPat; g.fillRect(0,0,W,H); g.restore();
}
function vignette(strength){

}
function sky(a,b,c){

function hill(yBase,amp,col,phase,freq){

const ME={coat:'#f2e3c8',line:'#ab9165',scarf:'#dd8570',hair:'#6d5540'};

function person(x,y,s,o){
  o=o||{};

  const cCoat=dark?D:(o.coat||p.coat), cLine=dark?D:(o.line||p.line),
        cScarf=dark?D:(o.scarf||p.scarf), cHair=dark?D:(o.hair||p.hair),
        cSkin=dark?D:'#f7e5d0';
  const T=o.t===undefined?FX.t:o.t, ph=o.ph||0;
  g.save();
  g.translate(x,y);
  if(o.shadow!==false){ g.save(); g.globalAlpha=0.16; g.fillStyle='#41331f';
    g.beginPath(); g.ellipse(0,1.5,19*s,5*s,0,0,7); g.fill(); g.restore(); }
  g.scale(o.flip?-s:s,s);
  g.translate(0,(o.bob||0));
  /* 外套 */
  g.beginPath();
  g.moveTo(-17,0); g.bezierCurveTo(-15,-22,-12.5,-32,-8,-38);
  g.lineTo(8,-38); g.bezierCurveTo(12.5,-32,15,-22,17,0);
  g.quadraticCurveTo(0,5,-17,0); g.closePath();
  g.fillStyle=cCoat; g.fill();
  if(!dark){ g.strokeStyle=cLine; g.lineWidth=1.3; g.stroke(); }
  /* 腕 */
  const armPath=()=>{
    g.beginPath();
    if(o.hand){ g.moveTo(-15,-32.5); g.quadraticCurveTo(-16.5,-23,-5,-26); }
    else if(o.reach){ g.moveTo(-12,-31); g.quadraticCurveTo(-16,-24,-19,-15); }
    else { g.moveTo(-13,-31); g.quadraticCurveTo(-15,-22,-14,-13); }
  };
  if(!dark){ armPath(); g.strokeStyle=cLine; g.lineWidth=6.4; g.lineCap='round'; g.stroke(); }
  armPath(); g.strokeStyle=cCoat; g.lineWidth=4.8; g.lineCap='round'; g.stroke();
  if(o.hand){ g.fillStyle=cSkin; g.beginPath(); g.arc(-5,-26,2.8,0,7); g.fill();
    if(!dark){ g.strokeStyle=cLine; g.lineWidth=0.9; g.stroke(); } }
  /* 襟巻 */
  g.fillStyle=cScarf;
  g.beginPath(); g.ellipse(0,-38.5,10.2,4.2,0,0,7); g.fill();
  const fl=Math.sin(T*2.4+ph)*3.2;
  g.beginPath(); g.moveTo(5,-39.5);
  g.quadraticCurveTo(14,-36+fl,20,-26+fl*1.5);
  g.quadraticCurveTo(13.5,-31,4,-35); g.closePath(); g.fill();
  /* 頭 */
  g.beginPath(); g.arc(0,-48.5,11,0,7); g.fillStyle=cSkin; g.fill();
  if(!dark){ g.strokeStyle=cLine; g.lineWidth=1.2; g.stroke(); }
  g.beginPath(); g.arc(0,-49.5,11.2,Math.PI*1.02,Math.PI*2.02); g.lineTo(9,-46);
  g.quadraticCurveTo(0,-54,-9,-46); g.closePath(); g.fillStyle=cHair; g.fill();
  /* 顔 */
  if(o.face&&!dark){
    g.fillStyle='#4a3a2a';
    g.beginPath(); g.arc(-3.8,-48.4,1.35,0,7); g.fill();
    g.beginPath(); g.arc(4.2,-48.4,1.35,0,7); g.fill();
    if(o.mood!=='flat'){
      g.strokeStyle='#8a6a52'; g.lineWidth=0.9; g.beginPath();
      g.arc(0.3,-45.4,2.6,0.25,Math.PI-0.25); g.stroke();
    }
  }
  g.restore();
}
function personLying(x,y,s,o){
  o=o||{}; const p=o.p||KI;
  g.save(); g.translate(x,y); g.scale(s,s);
  g.save(); g.globalAlpha=0.14; g.fillStyle='#3d4a2c';
  g.beginPath(); g.ellipse(4,4,34,7,0,0,7); g.fill(); g.restore();

function drawExamOverlay(){
  const E=FX.exam; if(!E) return;

    g.save(); g.strokeStyle='rgba(255,232,170,.55)'; g.lineWidth=1.6;

  });

  if(E.tool===0){

    g.beginPath(); g.arc(x,y,30,0,7); g.stroke();

    if(p>0.2){
      for(let i=0;i<3;i++){
        const rr2=34+i*11+Math.sin(FX.t*6-i)*3;
        g.strokeStyle='rgba(255,244,214,'+(p*(0.4-i*0.1)).toFixed(3)+')'; g.lineWidth=2;
        g.beginPath(); g.arc(x,y,rr2,-0.9,0.9); g.stroke();

function drawOverlay(dt){
  for(let i=FX.ripples.length-1;i>=0;i--){
    const r=FX.ripples[i]; r.age+=dt;
    if(r.age>=r.life){ FX.ripples.splice(i,1); continue; }
    const k=r.age/r.life;
    g.save(); g.globalAlpha=(1-k)*0.75; g.strokeStyle='#fdf6e2'; g.lineWidth=2.4*(1-k)+0.6;
    g.beginPath(); g.arc(r.x,r.y,r.r*(0.25+k*0.9),0,7); g.stroke(); g.restore();
  }
  if(FX.listen){
    const L=FX.listen;
    g.save();
    g.strokeStyle='rgba(255,252,236,'+(0.22+0.3*L.glow)+')'; g.lineWidth=2.4;
    g.beginPath(); g.arc(L.x,L.y,62+Math.sin(FX.t*2.6)*3.5,0,7); g.stroke();
    if(L.prog>0.01){
      g.strokeStyle='rgba(255,238,186,.92)'; g.lineWidth=4.5; g.lineCap='round';
      g.beginPath(); g.arc(L.x,L.y,62,-Math.PI/2,-Math.PI/2+Math.PI*2*Math.min(1,L.prog)); g.stroke();
    }
    g.restore();
  }
  drawExamOverlay();
  for(let i=FX.pops.length-1;i>=0;i--){
    const p=FX.pops[i]; p.age+=dt;
    if(p.age>=p.life){ FX.pops.splice(i,1); continue; }
    const k=p.age/p.life, a=k<0.12?k/0.12:(1-Math.pow(Math.max(0,(k-0.55))/0.45,1.6));
    g.save(); g.globalAlpha=Math.max(0,a);
    g.font='300 '+p.size+'px "Hiragino Mincho ProN","Yu Mincho",serif';
    g.textAlign='center'; g.shadowColor='rgba(10,10,14,.7)'; g.shadowBlur=16;
    g.fillStyle='#fffdf4';
    g.fillText(p.txt,p.x,p.y-p.age*13);
    g.restore();
  }
  g.textAlign='left';
  if(FX.dim>0.001){ g.fillStyle='rgba(6,8,12,'+Math.min(1,FX.dim)+')'; g.fillRect(0,0,W,H); }
}

/* =========================================================
   主ループ
   ========================================================= */
function tickListen(dt){
  const L=FX.listen; if(!L) return;
  L.glow=Math.max(0,L.glow-dt*1.4);
  if(L.done) return;
  if(IN.down){
    L.prog+=dt/L.need;
    L.beatT-=dt;
    if(L.beatT<=0){
      L.beatT=1.05; L.beats++;
      if(L.beats<=L.beatCount){
        heart(0.9); L.glow=1; ripple(L.x,L.y,66);
        pop(L.px,L.py,'ドクン',30,1.5);
      }
    }
    if(L.prog>=1){
      L.done=true; L.prog=1;
      const r=L.res; L.res=null; if(r) r();
    }
  }else{
    L.prog=Math.max(0,L.prog-dt*0.5);
  }
}
function tickExam(dt){
  const E=FX.exam; if(!E) return;
  E.x+= (Math.max(210,Math.min(752,IN.x))-E.x)*Math.min(1,dt*18);
  E.y+= (Math.max(150,Math.min(452,IN.y))-E.y)*Math.min(1,dt*18);
  let near=-1,nd=1e9;
  SPOTS.forEach((s,i)=>{
    if(E.found[i]||s.tool!==E.tool) return;
    const d=Math.hypot(E.x-s.x,E.y-s.y); if(d<nd){nd=d;near=i;}
  });
  E.near=near; E.prox=near>=0?Math.max(0,1-nd/140):0;
  const inRange=near>=0&&nd<38;
  if(inRange&&IN.down) E.hold+=dt; else E.hold=Math.max(0,E.hold-dt*1.8);
  E.sfxT-=dt;
  if(E.sfxT<=0){
    E.sfxT=1.0+Math.random()*0.5;
    if(E.tool===0) heart(0.3+E.prox*0.45);
    if(E.prox>0.3) setTimeout(()=>flutter(2,true,0.3+E.prox*0.8),240);
  }
  if(E.hold>=1.15&&near>=0){
    E.found[near]=true; E.hold=0;
    chime(1318.51,0.09); flutter(3,true,0.95);
    ripple(SPOTS[near].x,SPOTS[near].y,52);
    const d=document.querySelector('#found div[data-i="'+near+'"]');
    if(d){ d.textContent='・'+SPOTS[near].txt; d.classList.add('on'); }
    if(E.found.every(Boolean)){
      const r=E.res; FX.exam=null;
      el.tools.classList.add('hide'); hint('');
      setTimeout(()=>{ if(r) r(); },900);
    }
  }
}
let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  FX.t+=dt;
  FX.dim+=(FX.dimTo-FX.dim)*Math.min(1,dt*3.2);
  tickText(dt); tickListen(dt); tickExam(dt);
  if(SC.k<1){
    SC.k=Math.min(1,SC.k+dt*SC.spd);
    if(SC.k>=1){ SC.prev=null; if(SC.res){ const r=SC.res; SC.res=null; r(); } }
  }
  const cur=PAINT[SC.cur]||PAINT.black;
  if(SC.prev){ (PAINT[SC.prev]||PAINT.black)(FX.t); g.save(); g.globalAlpha=SC.k; cur(FX.t); g.restore(); }
  else cur(FX.t);
  drawOverlay(dt);
  requestAnimationFrame(loop);
}

function tween(o,k,to,sec){
  return new Promise(res=>{
    const from=o[k], t0=performance.now(), ms=sec*1000;
    (function st(){
      const q=Math.min(1,(performance.now()-t0)/ms);
      o[k]=from+(to-from)*q;
      if(q<1) requestAnimationFrame(st); else res();
    })();
  });
}
