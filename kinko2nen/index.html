<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>金庫二年</title>
<meta name="description" content="「禁錮二年」だと思ったら「金庫二年」だった。ブラウザで遊べる不条理コメディ短編。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='8' fill='%234a4f59'/%3E%3Crect x='10' y='10' width='44' height='44' rx='5' fill='%236a707b'/%3E%3Ccircle cx='40' cy='32' r='9' fill='%232f343c' stroke='%23cbd2dc' stroke-width='3'/%3E%3Ccircle cx='22' cy='32' r='7' fill='none' stroke='%23cbd2dc' stroke-width='3'/%3E%3C/svg%3E">
<style>
/* ============ base ============ */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:#050506;color:#eae6dc;overflow:hidden;
  font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",YuGothic,"Noto Sans JP",Meiryo,sans-serif;
  display:flex;align-items:center;justify-content:center;
  -webkit-font-smoothing:antialiased;
}
#wrap{position:relative}
#stage{
  position:relative;overflow:hidden;background:#07080a;
  width:min(100vw, 160vh);aspect-ratio:16/10;
  box-shadow:0 0 0 1px #23252b, 0 1.4em 5em rgba(0,0,0,.8);
  font-size:20px; /* JS が実寸に合わせて更新 */
  cursor:pointer;user-select:none;
}
.layer{position:absolute;inset:0}
.hide{display:none!important}
.fade{transition:opacity .5s ease}
.op0{opacity:0}

/* ============ 00 : 判決 ============ */
#op{background:#000;display:flex;align-items:center;justify-content:center}
#verdict{
  font-family:"Hiragino Mincho ProN","Yu Mincho",YuMincho,"Noto Serif JP",serif;
  font-size:2.35em;letter-spacing:.1em;color:#f4f1e8;white-space:nowrap;
  text-shadow:0 0 1.2em rgba(255,240,210,.18);opacity:0;
}
#verdict .seg{display:inline-block;opacity:0;transform:translateY(.18em);
  transition:opacity .55s ease, transform .55s ease}
#kinWrap{position:relative;display:inline-block}
#kinOld{display:inline-block;transition:opacity .45s ease, filter .45s ease}
#strikeLine{
  transition:width .42s cubic-bezier(.4,.1,.3,1), opacity .4s ease;
  position:absolute;left:-.08em;top:.5em;height:.075em;width:0;border-radius:.05em;
  background:linear-gradient(90deg,#e2382c,#ff6a5c);
  box-shadow:0 0 .35em rgba(226,56,44,.75);
}
#fixWord{
  transition:all .5s cubic-bezier(.25,1.4,.45,1);
  position:absolute;left:0;top:-1.24em;color:#ff4a3d;opacity:0;
  transform:scale(.55) rotate(-4deg);transform-origin:50% 100%;
  text-shadow:0 0 .5em rgba(255,74,61,.5);
}
#fixMark{
  transition:all .3s ease;
  position:absolute;left:50%;top:-.5em;transform:translateX(-50%) scale(.4);
  color:#ff4a3d;font-size:.38em;opacity:0;
}
#opStamp{
  transition:all .35s cubic-bezier(.2,1.6,.4,1);
  position:absolute;right:8%;top:16%;font-size:1.5em;color:#ff4a3d;opacity:0;
  border:.12em solid #ff4a3d;border-radius:.2em;padding:.12em .3em;
  transform:rotate(-13deg) scale(1.6);letter-spacing:.16em;
  font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
}

/* ============ 共通ステージ ============ */
#bg{position:absolute;inset:0}
#bg svg{width:100%;height:100%;display:block}
#cone{opacity:0;transition:opacity 1.2s ease;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,240,205,.22),rgba(255,240,205,.03) 76%,transparent);
  clip-path:polygon(43% 0, 57% 0, 84% 100%, 16% 100%)}
#dark{position:absolute;inset:0;background:#000;opacity:1;pointer-events:none}
#spot{position:absolute;inset:0;pointer-events:none;opacity:0}
#chars{position:absolute;inset:0}
.actor{position:absolute;bottom:17%;transition:opacity .35s ease, transform .35s ease}
.actor svg{display:block;height:100%;width:auto}
#hero{left:50%;height:60%;transform:translateX(-50%)}
#npc{right:9%;height:50%;opacity:0;transform:translateX(1.2em)}
#npc.in{opacity:1;transform:translateX(0)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-.22em)}}
@keyframes shakeX{0%,100%{transform:translate(0,0)}20%{transform:translate(-.28em,.06em)}
  45%{transform:translate(.26em,-.04em)}70%{transform:translate(-.16em,.03em)}}
#heroInner{animation:bob 3.4s ease-in-out infinite;transform-origin:50% 100%}
#heroInner.shake{animation:shakeX .42s ease-in-out}
#heroInner.strug{animation:shakeX .3s ease-in-out 6}

/* ============ HUD ============ */
#hud{position:absolute;left:1.1em;top:.9em;font-size:.62em;letter-spacing:.06em;
  color:#cfc9ba;text-shadow:0 .08em .3em rgba(0,0,0,.9);opacity:0;transition:opacity .4s}
#hud.on{opacity:1}
#hudDay{font-size:1.35em;color:#f0e9d6;margin-bottom:.5em;font-weight:700}
.meter{display:flex;align-items:center;gap:.5em;margin-top:.28em}
.meter span{width:6.9em;opacity:.85;white-space:nowrap}
.bar{width:8.4em;height:.62em;background:rgba(255,255,255,.12);border-radius:.4em;overflow:hidden}
.bar i{display:block;height:100%;width:100%;border-radius:.4em;transition:width .5s ease}
#mHuman i{background:linear-gradient(90deg,#7fd0a5,#4fae86)}
#mSafe i{background:linear-gradient(90deg,#d7b262,#a8823a)}
#sndBtn{position:absolute;right:.9em;top:.9em;font-size:.72em;width:2.1em;height:2.1em;
  border-radius:50%;border:1px solid rgba(255,255,255,.28);background:rgba(0,0,0,.35);
  color:#e8e2d4;cursor:pointer;line-height:1;z-index:20}
#sndBtn{opacity:.45}
#sndBtn:hover{opacity:1}
#sndBtn.off{opacity:.28}

/* 収納物が飛んでいく演出 */
.fly{position:absolute;font-size:.62em;padding:.35em .6em;border-radius:.4em;
  background:#efe8d5;color:#2a2620;font-weight:700;box-shadow:0 .2em .6em rgba(0,0,0,.5);
  transition:transform .62s cubic-bezier(.5,-.35,.5,1.2), opacity .62s ease;z-index:15}

/* ============ 字幕 ============ */
#sub{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.86);opacity:0;transition:opacity .45s ease;pointer-events:none}
#sub b{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:2em;
  letter-spacing:.24em;font-weight:400;color:#f0ead9}
#sub.on{opacity:1}

/* ============ 会話 ============ */
#dialog{position:absolute;left:5%;right:5%;bottom:3.5%;min-height:4.9em;
  background:linear-gradient(180deg,rgba(12,13,16,.92),rgba(12,13,16,.97));
  border:1px solid rgba(228,214,178,.28);border-radius:.5em;
  padding:1.35em 1.4em 1.1em;opacity:0;transition:opacity .3s ease;
  box-shadow:0 .5em 2em rgba(0,0,0,.6)}
#dialog.on{opacity:1}
#who{position:absolute;left:1.1em;top:-.85em;background:#1b1d22;
  border:1px solid rgba(228,214,178,.4);border-radius:.32em;padding:.2em .8em;
  font-size:.72em;letter-spacing:.1em;color:#f0e3c0}
#line{font-size:1.02em;line-height:1.75;letter-spacing:.04em;min-height:2.4em}
#line .em{color:#ffd9a0}
#next{position:absolute;right:1.1em;bottom:.7em;font-size:.7em;color:#c9bfa5;opacity:0;
  animation:blink 1.1s ease-in-out infinite}
#next.on{opacity:1}
@keyframes blink{0%,100%{opacity:.15}50%{opacity:.95}}

/* ============ 選択肢 ============ */
#choices{position:absolute;left:11%;right:11%;bottom:25.5%;display:flex;flex-direction:column;
  gap:.45em;opacity:0;pointer-events:none;transition:opacity .3s ease}
#choices.on{opacity:1;pointer-events:auto}
.choice{
  font:inherit;font-size:.88em;text-align:left;padding:.6em 1.1em;cursor:pointer;
  background:linear-gradient(180deg,rgba(30,32,38,.96),rgba(18,19,23,.96));
  border:1px solid rgba(228,214,178,.45);border-radius:.4em;color:#efe9db;
  transition:transform .12s ease, background .15s ease, border-color .15s ease;
}
.choice:hover,.choice:focus-visible{background:linear-gradient(180deg,#3a3d47,#24262c);
  border-color:#e8d9ab;transform:translateX(.3em);outline:none}
.choice b{color:#e6c072;margin-right:.7em;font-weight:700}

/* ============ タイトル ============ */
#title{background:#050506;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4em}
#logo{position:relative;padding:.5em 1.1em;border-radius:.14em;
  background:linear-gradient(160deg,#6c727d 0%,#454a54 28%,#2f333b 52%,#4d525c 78%,#31353d 100%);
  box-shadow:inset 0 0 0 .1em rgba(255,255,255,.14), inset 0 0 2em rgba(0,0,0,.6), 0 .8em 2.4em rgba(0,0,0,.8);
  border:.14em solid #23262c}
#logo h1{
  font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:3.4em;font-weight:700;letter-spacing:.14em;
  background:linear-gradient(180deg,#fff8e4 8%,#e6cd88 36%,#8d6f2c 53%,#f5e7bb 68%,#a98526 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 .04em .06em rgba(0,0,0,.35)}
.rivet{position:absolute;width:.42em;height:.42em;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#cfd4dc,#6a7079 60%,#33373d);}
.rivet.a{left:.42em;top:.42em}.rivet.b{right:.42em;top:.42em}
.rivet.c{left:.42em;bottom:.42em}.rivet.d{right:.42em;bottom:.42em}
#tagline{font-size:.85em;letter-spacing:.3em;color:#b9b1a0}
#startBtn,.btn{
  font:inherit;font-size:.95em;letter-spacing:.14em;padding:.85em 2.2em;cursor:pointer;
  color:#12131a;background:linear-gradient(180deg,#f2e5bb,#c9a54e);
  border:none;border-radius:.35em;box-shadow:0 .35em 1.2em rgba(201,165,78,.28);
  transition:transform .12s ease, filter .15s ease}
#startBtn:hover,.btn:hover{transform:translateY(-.12em);filter:brightness(1.08)}
#hint{font-size:.66em;color:#7d7768;letter-spacing:.1em}

/* ============ エンディング / 評定 ============ */
#end{background:#050506;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity 1s ease}
#end.on{opacity:1}
#endInner{width:78%;max-height:94%;text-align:center}
#endTitle{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:1.9em;letter-spacing:.5em;
  color:#f2ecdb;margin-bottom:.5em}
#report{border:1px solid rgba(228,214,178,.3);border-radius:.4em;padding:.9em 1.1em;
  background:rgba(255,255,255,.03);text-align:left;font-size:.7em;line-height:1.8}
#report h3{font-size:1.05em;letter-spacing:.18em;color:#e8cf94;margin-bottom:.6em;font-weight:700}
.rrow{display:flex;justify-content:space-between;gap:1em;border-bottom:1px dotted rgba(255,255,255,.14);padding:.18em 0}
.rrow span:last-child{color:#f0e5c8}
#items{margin-top:.7em;font-size:.92em;color:#c6bea9;line-height:1.8}
#endBtns{margin-top:1em;display:flex;gap:.8em;justify-content:center}
</style>
</head>
<body>
<div id="wrap"><div id="stage">

  <!-- 背景 / キャラクター -->
  <div id="bg" class="layer"></div>
  <div id="cone" class="layer"></div>
  <div id="chars" class="layer">
    <div id="npc" class="actor"></div>
    <div id="hero" class="actor">
      <div id="heroInner" style="height:100%">
        <svg viewBox="0 0 220 320" aria-label="金庫の着ぐるみを着た主人公">
          <defs>
            <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#7b828e"/><stop offset=".35" stop-color="#565c67"/>
              <stop offset=".62" stop-color="#3c414a"/><stop offset="1" stop-color="#5a606b"/>
            </linearGradient>
            <linearGradient id="door" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#6a707b"/><stop offset=".5" stop-color="#4a4f59"/>

            </linearGradient>
            <radialGradient id="knob" cx=".35" cy=".3">
              <stop offset="0" stop-color="#e6e9ee"/><stop offset=".55" stop-color="#9aa0aa"/>
              <stop offset="1" stop-color="#4c515a"/>
            </radialGradient>
          </defs>

          <!-- 脚 -->
          <g stroke="#e8b98f" stroke-width="8" stroke-linecap="round">
            <path d="M86 262 L80 300"/><path d="M134 262 L140 300"/>
          </g>
          <ellipse cx="74" cy="304" rx="17" ry="8" fill="#20242b"/>
          <ellipse cx="146" cy="304" rx="17" ry="8" fill="#20242b"/>

          <!-- 腕 -->
          <g id="arms" stroke="#e8b98f" stroke-width="8" stroke-linecap="round" fill="none">
            <path id="armL" d="M28 152 C6 168 4 190 10 208"/>
            <path id="armR" d="M192 152 C214 168 216 190 210 208"/>
          </g>
          <circle id="handL" cx="10" cy="212" r="9" fill="#f0c298"/>
          <circle id="handR" cx="210" cy="212" r="9" fill="#f0c298"/>

          <!-- 金庫本体 -->
          <rect x="24" y="56" width="172" height="214" rx="11" fill="url(#steel)" stroke="#22262c" stroke-width="3"/>
          <rect x="30" y="62" width="160" height="202" rx="8" fill="none" stroke="rgba(255,255,255,.13)" stroke-width="2"/>
          <!-- 蝶番 -->
          <rect x="17" y="88" width="14" height="26" rx="4" fill="#3d424b" stroke="#22262c" stroke-width="2"/>
          <rect x="17" y="200" width="14" height="26" rx="4" fill="#3d424b" stroke="#22262c" stroke-width="2"/>
          <!-- 扉 -->
          <rect x="40" y="72" width="142" height="182" rx="7" fill="url(#door)" stroke="#262a31" stroke-width="2.5"/>
          <rect x="48" y="80" width="126" height="166" rx="5" fill="none" stroke="rgba(255,255,255,.09)" stroke-width="2"/>

          <!-- 顔がのぞく窓 -->
          <rect x="72" y="86" width="76" height="66" rx="12" fill="#191c21"/>
          <rect x="72" y="86" width="76" height="66" rx="12" fill="none" stroke="#8b929d" stroke-width="4"/>
          <g id="face">
            <ellipse cx="110" cy="122" rx="30" ry="27" fill="#f3c8a0"/>
            <!-- 目 -->
            <g id="eyeNormal">
              <circle cx="99" cy="118" r="3.4" fill="#1d1f24"/><circle cx="121" cy="118" r="3.4" fill="#1d1f24"/>
              <path d="M93 110 L105 108 M115 108 L127 110" stroke="#1d1f24" stroke-width="2.4" stroke-linecap="round"/>
            </g>
            <g id="eyeShout" style="display:none">
              <circle cx="99" cy="119" r="6" fill="#fff"/><circle cx="121" cy="119" r="6" fill="#fff"/>
              <circle cx="99" cy="119" r="3.2" fill="#14161a"/><circle cx="121" cy="119" r="3.2" fill="#14161a"/>
              <path d="M91 108 L106 112 M114 112 L129 108" stroke="#1d1f24" stroke-width="3" stroke-linecap="round"/>
            </g>
            <g id="eyeDead" style="display:none">
              <path d="M92 118 L106 118 M114 118 L128 118" stroke="#1d1f24" stroke-width="3" stroke-linecap="round"/>
              <path d="M93 108 L105 111 M115 111 L127 108" stroke="#1d1f24" stroke-width="2.2" stroke-linecap="round"/>
            </g>
            <g id="eyeFlat" style="display:none">
              <path d="M93 116 L106 116 M114 116 L127 116" stroke="#1d1f24" stroke-width="3.4" stroke-linecap="round"/>
              <circle cx="99.5" cy="121" r="2.6" fill="#1d1f24"/><circle cx="120.5" cy="121" r="2.6" fill="#1d1f24"/>
            </g>
            <g id="eyeClosed" style="display:none">
              <path d="M93 120 Q99.5 112 106 120 M114 120 Q120.5 112 127 120" stroke="#1d1f24"
                    stroke-width="3" fill="none" stroke-linecap="round"/>
            </g>
            <!-- 口 -->
            <g id="mNormal"><path d="M103 137 L117 137" stroke="#1d1f24" stroke-width="2.8" stroke-linecap="round"/></g>
            <g id="mShout" style="display:none">
              <ellipse cx="110" cy="139" rx="12" ry="10" fill="#5d2a2a"/>
              <ellipse cx="110" cy="134.5" rx="9" ry="3" fill="#fff"/>
            </g>
            <g id="mWobble" style="display:none">
              <path d="M100 138 q4 -5 7 0 t7 0" stroke="#1d1f24" stroke-width="2.8" fill="none" stroke-linecap="round"/>
            </g>
            <g id="mSmile" style="display:none">
              <path d="M100 134 q10 11 20 0" stroke="#1d1f24" stroke-width="2.8" fill="none" stroke-linecap="round"/>
            </g>
            <g id="mFlat" style="display:none">
              <path d="M99 140 L121 140" stroke="#1d1f24" stroke-width="2.6" stroke-linecap="round"/>

          </g>

          <!-- 銘板 -->
          <rect x="82" y="160" width="56" height="17" rx="3" fill="#2c3037" stroke="#8b929d" stroke-width="1.6"/>
          <text x="110" y="173" text-anchor="middle" font-size="12" fill="#cbd2dc"
                font-family="serif" letter-spacing="2">金庫</text>

          <!-- ダイヤルとハンドル -->
          <circle cx="150" cy="205" r="25" fill="#2f343c" stroke="#8b929d" stroke-width="3"/>
          <circle cx="150" cy="205" r="14" fill="url(#knob)"/>

            <path d="M150 227 L150 222"/><path d="M128 205 L133 205"/>
          </g>
          <g id="wheel" transform="translate(74,205)">
            <circle r="21" fill="none" stroke="#9aa1ab" stroke-width="5"/>
            <circle r="7" fill="url(#knob)"/>

              <path d="M0 -20 L0 -6"/><path d="M0 20 L0 6"/><path d="M-20 0 L-6 0"/><path d="M20 0 L6 0"/>
            </g>
          </g>

          <!-- リベット -->
          <g fill="#9aa1ab">
            <circle cx="36" cy="68" r="3.4"/><circle cx="184" cy="68" r="3.4"/>

          </g>
        </svg>
      </div>
    </div>
  </div>
  <div id="spot" class="layer"></div>

  <div id="dark" class="layer"></div>

  <!-- HUD -->
  <div id="hud">
    <div id="hudDay">刑期 1日目</div>
    <div class="meter"><span>人間のつもり</span><div class="bar" id="mHuman"><i></i></div></div>
    <div class="meter"><span>金庫適性</span><div class="bar" id="mSafe"><i style="width:6%"></i></div></div>
  </div>
  <button id="sndBtn" title="音の ON / OFF">♪</button>

  <!-- 字幕 -->
  <div id="sub" class="layer"><b></b></div>

  <!-- 会話 -->
  <div id="dialog">
    <div id="who">主人公</div>
    <div id="line"></div>
    <div id="next">▼</div>
  </div>
  <div id="choices"></div>

  <!-- OP：判決 -->
  <div id="op" class="layer">
    <div id="verdict">
      <span class="seg" id="seg1">判決。</span><span class="seg" id="seg2">被告人を</span><span
        class="seg" id="seg3"><span id="kinWrap"><span id="kinOld">禁錮</span><span id="strikeLine"></span><span id="fixWord">金庫</span><span id="fixMark">＼／</span></span></span><span
        class="seg" id="seg4">二年に処す</span>
    </div>
    <div id="opStamp">訂正</div>
  </div>

  <!-- タイトル -->
  <div id="title" class="layer hide">
    <div id="logo">
      <h1>金庫二年</h1>
      <i class="rivet a"></i><i class="rivet b"></i><i class="rivet c"></i><i class="rivet d"></i>
    </div>
    <div id="tagline">A SHORT ABSURD COMEDY</div>

        <div id="rrows"></div>
        <div id="items"></div>
      </div>
      <div id="endBtns">
        <button class="btn" id="againBtn">もう一度</button>
      </div>
    </div>
  </div>

</div></div>
<script>
"use strict";
/* =========================================================
   金庫二年 — 単一ファイル / 外部ライブラリなし
   ========================================================= */
const $ = (s) => document.querySelector(s);
const stage = $("#stage");

/* ---------- 画面サイズに合わせて em の基準を更新 ---------- */
function fit(){ stage.style.fontSize = (stage.clientWidth / 48) + "px"; }
addEventListener("resize", fit);

/* ---------- 待機 / トゥイーン ---------- */
let skipHold = false, opActive = false;     // OP 中にクリックされたら演出を早送り
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
async function hold(ms){
  const step = 30, end = performance.now() + ms;
  while (performance.now() < end){
    if (skipHold) return;
    await sleep(step);
  }
}
function tween(ms, fn){
  return new Promise(res => {
    const t0 = performance.now();
    (function loop(now){
      let p = Math.min(1, (now - t0) / ms);
      if (skipHold) p = 1;
      fn(p < 1 ? 1 - Math.pow(1 - p, 3) : 1);      // easeOutCubic
      p < 1 ? requestAnimationFrame(loop) : res();
    })(t0);
  });
}

/* ---------- 効果音（Web Audio で合成 / 無くても成立） ---------- */
const SFX = {
  on: true, ctx: null,
  init(){ if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} }
          if (this.ctx && this.ctx.state === "suspended") this.ctx.resume(); },
  tone(freq, dur, type, vol, slide){
    if (!this.on) return; this.init(); const c = this.ctx; if (!c) return;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || "sine"; o.frequency.setValueAtTime(freq, c.currentTime);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, slide), c.currentTime + dur);
    g.gain.setValueAtTime(0.0001, c.currentTime);
    g.gain.exponentialRampToValueAtTime(vol || 0.14, c.currentTime + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + dur);
    o.connect(g).connect(c.destination); o.start(); o.stop(c.currentTime + dur + 0.05);
  },
  noise(dur, vol, hp){
    if (!this.on) return; this.init(); const c = this.ctx; if (!c) return;
    const n = c.sampleRate * dur, buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = c.createBufferSource(); s.buffer = buf;
    const f = c.createBiquadFilter(); f.type = "highpass"; f.frequency.value = hp || 900;
    const g = c.createGain(); g.gain.value = vol || 0.12;
    s.connect(f).connect(g).connect(c.destination); s.start();
  },
  blip(){ this.tone(660 + Math.random()*90, 0.035, "square", 0.028); },
  gavel(){ this.tone(160, 0.22, "sine", 0.28, 60); this.noise(0.12, 0.12, 400); },
  scratch(){ this.noise(0.34, 0.14, 1400); },
  clang(){ this.tone(320, 0.5, "triangle", 0.16, 120); this.tone(214, 0.6, "sine", 0.1, 90); },
  click(){ this.tone(880, 0.05, "square", 0.05); },
  dial(){ for (let i=0;i<5;i++) setTimeout(()=>this.tone(1200, 0.02, "square", 0.03), i*70); },
  chime(){ [523,659,784,1047].forEach((f,i)=>setTimeout(()=>this.tone(f,0.5,"sine",0.09),i*110)); },
  low(){ this.tone(90, 0.8, "sine", 0.18, 50); }
};
$("#sndBtn").addEventListener("click", (e) => {

  SFX.on = !SFX.on; $("#sndBtn").classList.toggle("off", !SFX.on);
  if (SFX.on) SFX.click();
});

/* ---------- 会話表示 ---------- */
let typing = false, typeTimer = null;
function showDialog(on){ $("#dialog").classList.toggle("on", on); if (!on) $("#next").classList.remove("on"); }
function typeText(el, text){
  return new Promise(res => {
    typing = true; el.textContent = ""; let i = 0;
    typeTimer = setInterval(() => {
      el.textContent = text.slice(0, ++i);
      if (i % 2 === 0) SFX.blip();
      if (i >= text.length){ clearInterval(typeTimer); typing = false; res(); }
    }, 30);
  });
}
async function say(who, text, opt){
  opt = opt || {};
  const c = CAST[who] || { name: who };
  $("#who").textContent = c.name;
  showDialog(true);
  $("#next").classList.remove("on");
  if (who === "hero"){
    setFace(opt.face || "normal");
    if (opt.shake) shakeHero();
  }
  if (opt.sfx && SFX[opt.sfx]) SFX[opt.sfx]();
  const p = typeText($("#line"), text);
  await Promise.race([p, waitAdvance()]);
  if (typing){                               // 早送り
    clearInterval(typeTimer); typing = false; $("#line").textContent = text;
  }
  $("#next").classList.add("on");
  await waitAdvance();
  SFX.click();
}

/* ---------- 収納演出 ---------- */
const STATE = { items: [], accept: 0, refuse: 0, ask: 0, lock: 0, human: 100, safe: 6 };
function updHUD(day){
  if (day) $("#hudDay").textContent = day;
  $("#mHuman i").style.width = Math.max(0, Math.min(100, STATE.human)) + "%";
  $("#mSafe i").style.width  = Math.max(0, Math.min(100, STATE.safe)) + "%";
}
async function storeItem(label){
  STATE.items.push(label);
  const chip = document.createElement("div");
  chip.className = "fly"; chip.textContent = label;
  const r = stage.getBoundingClientRect();
  chip.style.left = "72%"; chip.style.top = "46%";
  stage.appendChild(chip);
  await hold(20);
  chip.style.transform = "translate(-" + (r.width * 0.26) + "px, " + (r.height * 0.06) + "px) scale(.4)";
  chip.style.opacity = "0";
  SFX.dial(); setTimeout(() => SFX.clang(), 260);
  await hold(680);
  chip.remove();
  STATE.safe = Math.min(100, STATE.safe + 12);
  updHUD();
}

/* ---------- 選択肢 ---------- */
function ask(options){
  return new Promise(res => {
    const box = $("#choices"); box.innerHTML = "";
    $("#next").classList.remove("on");
    options.forEach((o, i) => {
      const b = document.createElement("button");
      b.className = "choice";
      b.innerHTML = "<b>" + (i + 1) + "</b>" + o.label;
      b.addEventListener("click", (e) => {
        e.stopPropagation(); SFX.click();
        box.classList.remove("on"); box.innerHTML = "";
        if (o.kind === "accept"){ STATE.accept++; STATE.human = Math.max(0, STATE.human - 14); STATE.safe += 6; }
        if (o.kind === "refuse"){ STATE.refuse++; STATE.human = Math.min(100, STATE.human + 4); }
        if (o.kind === "ask"){    STATE.ask++;    STATE.human = Math.max(0, STATE.human - 4); STATE.safe += 2; }
        updHUD();
        res(o);
      });
      box.appendChild(b);
    });
    box.classList.add("on");
  });
}

/* ---------- スクリプト用ショートハンド ---------- */
const h  = (text, face, opt) => ({ t: "say", who: "hero", text, face, ...(opt || {}) });
const n  = (who, text, opt)  => ({ t: "say", who, text, ...(opt || {}) });
const sub= (text, ms)        => ({ t: "sub", text, ms });
const bg = (name)            => ({ t: "bg", name });
const inN= (id)              => ({ t: "in", id });
const out= ()                => ({ t: "out" });
const item=(label)           => ({ t: "item", label });
const day= (label)           => ({ t: "day", label });
const wait=(ms)              => ({ t: "wait", ms });
const choice=(opts)          => ({ t: "choice", opts });
const A = (label, steps) => ({ label, kind: "accept", steps });
const R = (label, steps) => ({ label, kind: "refuse", steps });
const Q = (label, steps) => ({ label, kind: "ask",    steps });

/* ---------- インタプリタ ---------- */
async function play(steps){
  for (const s of steps){
    switch (s.t){
      case "say":   await say(s.who, s.text, s); break;
      case "sub":   showDialog(false); await subtitle(s.text, s.ms); break;
      case "bg":    setBG(s.name); break;
      case "in":    await npcIn(s.id); break;
      case "out":   await npcOut(); break;
      case "item":  await storeItem(s.label); break;
      case "day":   updHUD(s.label); break;
      case "wait":  await hold(s.ms); break;
      case "choice":{
        const picked = await ask(s.opts);
        await play(picked.steps);
        break;
      }
      case "fn":    await s.fn(); break;
    }
  }
}

/* =========================================================
   演出 : スポットライト
   ========================================================= */
function setSpot(r, glow, darkA){
  const a = (darkA === undefined ? 0.97 : darkA);
  $("#spot").style.opacity = 1;
  $("#spot").style.background =
    "radial-gradient(circle at 50% 58%, rgba(255,238,196," + (glow === undefined ? .16 : glow) + ") 0%, rgba(255,238,196,0) " + (r * 1.1) + "%)," +
    "radial-gradient(circle at 50% 58%, rgba(0,0,0,0) " + (r * .72) + "%, rgba(0,0,0," + a + ") " + (r * 1.5) + "%)";
}

/* =========================================================
   OP : 判決
   ========================================================= */
function segIn(sel){
  const el = $(sel); el.style.opacity = 1; el.style.transform = "translateY(0)";
}
async function opening(){
  opActive = true; skipHold = false;
  setBG("court"); setSpot(0, .16); $("#dark").style.opacity = 1;
  await hold(800);

  $("#verdict").style.transition = "opacity .8s ease";
  $("#verdict").style.opacity = 1;
  segIn("#seg1"); SFX.gavel();
  await hold(1100);
  segIn("#seg2"); await hold(280);
  segIn("#seg3"); await hold(280);
  segIn("#seg4");
  await hold(2000);

  /* ── 訂正線 ── */
  SFX.scratch();
  $("#strikeLine").style.width = "calc(100% + .16em)";
  await hold(700);

  /* ── 赤字で「金庫」と書き込まれる ── */
  SFX.tone(520, .12, "square", .07);
  const fw = $("#fixWord"), fm = $("#fixMark");
  fm.style.opacity = ".9"; fm.style.transform = "translateX(-50%) scale(1)";
  fw.style.opacity = "1";  fw.style.transform = "scale(1) rotate(-4deg)";
  await hold(520);
  const st = $("#opStamp");
  st.style.opacity = ".95"; st.style.transform = "rotate(-13deg) scale(1)";
  SFX.tone(180, .18, "sine", .2, 90);
  await hold(1900);

  /* ── 訂正が確定して本文に収まる ── */
  SFX.clang();
  $("#kinOld").style.opacity = "0"; $("#kinOld").style.filter = "blur(.06em)";
  $("#strikeLine").style.opacity = "0";
  fm.style.opacity = "0";
  st.style.opacity = "0"; st.style.transform = "rotate(-13deg) scale(.85)";
  fw.style.top = "0"; fw.style.transform = "scale(1) rotate(0deg)";
  fw.style.color = "#f4f1e8"; fw.style.textShadow = "0 0 1.2em rgba(255,240,210,.25)";
  await hold(2300);
  SFX.gavel();
  await hold(1100);

  /* ── 暗転 ── */
  $("#verdict").style.opacity = 0;
  await hold(1000);
  $("#op").classList.add("hide");
  await hold(500);

  /* ── スポットライト点灯 ── */
  setFace("doubt");
  $("#dark").style.opacity = 0;
  SFX.tone(240, .5, "sine", .08);
  $("#cone").style.opacity = "1";
  await tween(1300, p => setSpot(2 + p * 50, .05 + p * .13));
  await hold(600);

  await npcIn("judge");
  await hold(300);
  opActive = false; skipHold = false;

  await say("hero", "……禁錮ですよね？", { face: "doubt" });
  await say("judge", "んにゃ、金庫");
  await say("hero", "いやいやいやいや", { face: "tsukkomi", shake: 1 });
}

/* =========================================================
   タイトル

async function toTitle(){
  showDialog(false);
  $("#dark").style.transition = "opacity .9s ease";
  $("#dark").style.opacity = 1;
  await hold(1000);
  await npcOut();
  $("#title").classList.remove("hide");
  SFX.chime();
  await new Promise(res => $("#startBtn").addEventListener("click", (e) => {
    e.stopPropagation(); SFX.click(); res();
  }, { once: true }));
  $("#title").classList.add("hide");
  await hold(300);
}

/* =========================================================
   エンディング / 勤務評定
   ========================================================= */
function row(k, v){ return '<div class="rrow"><span>' + k + '</span><span>' + v + '</span></div>'; }
function buildReport(){
  const m = Math.max(STATE.accept, STATE.refuse, STATE.ask);
  const ev = STATE.accept === m ? "優良金庫。来期も同じ場所に立っていてください"
           : STATE.refuse === m ? "ときどき喋る金庫。喋らないほうが望ましい"
           : "質問の多い金庫。回答は以上です";
  $("#rrows").innerHTML =
    row("勤続日数", "730日（無遅刻・無欠勤）") +
    row("預かった物", STATE.items.length + "件") +
    row("素直に入れた回数", STATE.accept + "回") +
    row("「俺は人間だ」と主張した回数", STATE.refuse + "回") +
    row("「これ金庫の仕事ですか」と聞いた回数", STATE.ask + "回") +
    row("中身を把握していない物", "1件（怖い）") +
    row("評定", ev);
  $("#items").innerHTML = "<b>腹の中：</b>" + STATE.items.join(" ／ ") +
    '<br><span style="opacity:.6">※ 備品につき、返却の必要はありません</span>';
}
async function finish(){
  showDialog(false);
  $("#hud").classList.remove("on");
  $("#dark").style.transition = "opacity 1.6s ease";
  $("#dark").style.opacity = 1;
  SFX.low();
  await hold(2000);
  buildReport();
  $("#end").classList.remove("hide");
  await hold(40);
  $("#end").classList.add("on");
  SFX.chime();
}
$("#againBtn").addEventListener("click", (e) => { e.stopPropagation(); location.reload(); });

/* =========================================================
   起動
   ========================================================= */
async function gate(){
  const g = document.createElement("div");
  g.style.cssText = "position:absolute;inset:0;z-index:40;background:#000;display:flex;" +
    "flex-direction:column;align-items:center;justify-content:center;gap:1.2em;cursor:pointer;" +
    "color:#8d8676;letter-spacing:.36em;font-size:1em";
  g.innerHTML = '<div>CLICK TO START</div>' +
    '<div style="font-size:.62em;opacity:.65;letter-spacing:.18em">音が出ます（右上の ♪ で切り替えられます）</div>';
  stage.appendChild(g);
  await new Promise(r => g.addEventListener("click", (e) => { e.stopPropagation(); r(); }, { once: true }));
  SFX.init(); SFX.click();
  g.remove();
}
(async function boot(){
  fit(); setFace("normal"); updHUD();
  await gate();
  await opening();
  await toTitle();
  await game();
  await finish();
})();
